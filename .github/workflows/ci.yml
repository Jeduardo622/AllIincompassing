name: CI

on:
  workflow_dispatch:
    inputs:
      activate_payroll_timesheets:
        description: Explicitly activate the reviewed payroll-timesheets Edge function
        required: true
        type: boolean
        default: false
      activate_payroll_export:
        description: Explicitly activate the reviewed payroll-export Edge function
        required: true
        type: boolean
        default: false
      activate_payroll_approvals:
        description: Explicitly activate the reviewed payroll-approvals Edge function
        required: true
        type: boolean
        default: false
      activate_payroll_administration:
        description: Explicitly activate the reviewed payroll-administration Edge function
        required: true
        type: boolean
        default: false
      approval_acknowledgement:
        description: Exact owner approval acknowledgement
        required: true
        type: string
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  merge_group:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change_scope:
    name: change-scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
      ai_agent_changed: ${{ steps.detect.outputs.ai_agent_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Detect docs-only scope
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          base_sha=""
          head_sha="${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            base_sha="${{ github.event.before }}"
            head_sha="${GITHUB_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            base_sha="${{ github.event.merge_group.base_sha }}"
            head_sha="${{ github.event.merge_group.head_sha }}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            base_sha="${GITHUB_SHA}^"
            head_sha="${GITHUB_SHA}"
          fi

          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

          # Fall back to full pipeline if diff metadata is unavailable.
          if [ -z "${base_sha}" ] || [ "${base_sha}" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            echo "ai_agent_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"
          if [ -z "${changed_files}" ]; then
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            echo "ai_agent_changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          docs_only=true
          ai_agent_changed=false
          while IFS= read -r file; do
            if ! printf '%s\n' "${file}" | grep -Eq '^(docs/.*\.md$|reports/.*\.md$|README.*\.md$|AGENTS\.md$|\.agents/skills/.*/SKILL\.md$|\.cursor/skills/.*/SKILL\.md$)'; then
              docs_only=false
            fi
            if printf '%s\n' "${file}" | grep -Eq '^supabase/functions/(ai-agent-optimized/|_shared/(database|auth|org|logging|cors|supabaseEnv|requestAuthHeaders)\.ts$|lib/http/error\.ts$)'; then
              ai_agent_changed=true
            fi
          done <<< "${changed_files}"

          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "ai_agent_changed=${ai_agent_changed}" >> "${GITHUB_OUTPUT}"
          echo "Detected docs_only=${docs_only}"
          echo "Detected ai_agent_changed=${ai_agent_changed}"

  docs_guard:
    name: docs-guard
    runs-on: ubuntu-latest
    needs: change_scope
    if: needs.change_scope.outputs.docs_only == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      - name: Validate npm run examples in changed docs
        shell: bash
        env:
          BASE_SHA: ${{ needs.change_scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.change_scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
            echo "Missing diff SHAs; skipping docs command validation."
            exit 0
          fi

          mapfile -t changed_docs < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '^(docs/.*\.md$|reports/.*\.md$|README.*\.md$|AGENTS\.md$|\.agents/skills/.*/SKILL\.md$|\.cursor/skills/.*/SKILL\.md$)' || true)
          if [ "${#changed_docs[@]}" -eq 0 ]; then
            echo "No tracked docs files changed."
            exit 0
          fi

          node - "${changed_docs[@]}" <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const scripts = new Set(Object.keys(pkg.scripts ?? {}));
          const files = process.argv.slice(2);
          const missing = [];
          const re = /npm run ([a-zA-Z0-9:_-]+)/g;

          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const text = fs.readFileSync(file, 'utf8');
            let match;
            while ((match = re.exec(text)) !== null) {
              if (!scripts.has(match[1])) {
                missing.push({ file, command: match[1] });
              }
            }
          }

          if (missing.length > 0) {
            console.error('Found non-existent npm scripts in docs:');
            for (const item of missing) {
              console.error(`- ${item.file}: npm run ${item.command}`);
            }
            process.exit(1);
          }

          console.log(`Validated npm run examples in ${files.length} docs file(s).`);
          NODE

  policy:
    name: policy
    runs-on: ubuntu-latest
    needs: change_scope
    if: needs.change_scope.outputs.docs_only != 'true'
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Validate secrets policy
        run: npm run ci:secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORGANIZATION: ${{ secrets.OPENAI_ORGANIZATION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_JWT_ORG_A: ${{ secrets.TEST_JWT_ORG_A }}
          TEST_JWT_ORG_B: ${{ secrets.TEST_JWT_ORG_B }}
          TEST_JWT_SUPER_ADMIN: ${{ secrets.TEST_JWT_SUPER_ADMIN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_STAGING_SITE_ID: ${{ secrets.NETLIFY_STAGING_SITE_ID }}
          NETLIFY_PRODUCTION_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}

      - name: Policy checks
        run: npm run ci:check-focused
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PROTECTED_BRANCHES: "main"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CI_SUPABASE_AUTH_PARITY_REQUIRED: "true"
          CI_EDGE_ROUTE_PARITY_REQUIRED: "true"
          SUPABASE_FUNCTION_PARITY_SCOPE: "sessions-book,sessions-hold,sessions-confirm,sessions-start,sessions-cancel,generate-session-notes-pdf,session-notes-pdf-status,session-notes-pdf-download,programs,goals,goal-targets,program-notes"
          SUPABASE_PENDING_FUNCTION_PARITY_SCOPE: "payroll-timesheets,payroll-administration,payroll-approvals,payroll-export"
          CI_RLS_OVERLAP_REQUIRED: ${{ secrets.SUPABASE_DB_URL != '' && 'true' || 'false' }}
          CI_REQUIRED_CHECKS: "ci-gate"
          API_AUTHORITY_MODE: "edge"
          RATE_LIMIT_MODE: "memory"

  tenant_safety:
    name: tenant-safety
    runs-on: ubuntu-latest
    needs: policy
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Validate tenant isolation
        run: npm run validate:tenant

  runtime_migration_parity:
    name: runtime-migration-parity
    runs-on: ubuntu-latest
    needs:
      - policy
      - change_scope
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.actor_id == '129695080' && github.event.repository.owner.type == 'User' && github.event.repository.owner.login == github.repository_owner && github.event.repository.owner.id == 129695080 && inputs.approval_acknowledgement == 'I_APPROVE_WIN_219_PAYROLL_ACTIVATION' && (inputs.activate_payroll_timesheets == true || inputs.activate_payroll_administration == true || inputs.activate_payroll_approvals == true || inputs.activate_payroll_export == true))
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Check runtime migration parity
        env:
          MIGRATION_PARITY_BASE_SHA: ${{ needs.change_scope.outputs.base_sha }}
          MIGRATION_PARITY_HEAD_SHA: ${{ needs.change_scope.outputs.head_sha }}
          MIGRATION_PARITY_REQUIRED_MIGRATIONS: "20260811214856|payroll_timekeeping_capture_read_model,20260812060529|payroll_timesheet_snapshots,20260812103000|payroll_session_lifecycle_context,20260812113000|payroll_session_lifecycle_context_disabled_state,20260812122436|payroll_approval_workflow,20260812141324|payroll_review_read_models,20260812153628|payroll_administration,20260812185531|payroll_approval_workflow_repair,20260812212854|payroll_timesheet_period_contract_repair,20260812230837|payroll_export_ledger,20260813013000|payroll_approval_codex_review_fixes,20260813103000|payroll_security_repair"
          ACTIVATE_PAYROLL_TIMESHEETS: ${{ inputs.activate_payroll_timesheets || false }}
          ACTIVATE_PAYROLL_EXPORT: ${{ inputs.activate_payroll_export || false }}
          ACTIVATE_PAYROLL_APPROVALS: ${{ inputs.activate_payroll_approvals || false }}
          ACTIVATE_PAYROLL_ADMINISTRATION: ${{ inputs.activate_payroll_administration || false }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/ci/check-runtime-migration-parity.mjs

  start_session_runtime_contract:
    name: start-session-runtime-contract
    runs-on: ubuntu-latest
    needs: policy
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Check start_session_with_goals runtime contract
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/ci/check-session-runtime-contract.mjs

  deploy_session_edge:
    name: deploy-session-edge
    runs-on: ubuntu-latest
    needs:
      - policy
      - tenant_safety
      - runtime_migration_parity
      - start_session_runtime_contract
      - lint_typecheck
      - unit_tests
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Validate session edge deploy prerequisites
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci/check-edge-deploy-prerequisites.mjs session-edge

      - name: Deploy required session edge functions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run ci:deploy:session-edge-bundle

      - name: Deploy fill-docs with static templates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run ci:deploy:fill-docs-function

  deploy_ai_agent_edge:
    name: deploy-ai-agent-edge
    runs-on: ubuntu-latest
    needs:
      - deploy_session_edge
      - change_scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.change_scope.outputs.ai_agent_changed == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Validate AI agent edge deploy prerequisites
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci/check-edge-deploy-prerequisites.mjs ai-agent-optimized

      - name: Deploy ai-agent-optimized edge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run ci:deploy:ai-agent-function

  deploy_payroll_timesheets:
    name: deploy-payroll-timesheets
    runs-on: ubuntu-latest
    needs:
      - policy
      - tenant_safety
      - runtime_migration_parity
      - lint_typecheck
      - unit_tests
      - build
      - auth_browser_smoke
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.actor_id == '129695080' && github.event.repository.owner.type == 'User' && github.event.repository.owner.login == github.repository_owner && github.event.repository.owner.id == 129695080 && inputs.approval_acknowledgement == 'I_APPROVE_WIN_219_PAYROLL_ACTIVATION' && inputs.activate_payroll_timesheets == true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Attest payroll-timesheets current main before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_ref_record="$(gh api --method GET "repos/${GH_REPOSITORY}/git/ref/heads/main" --jq '[.ref, .object.sha] | @tsv')"
          IFS=$'\t' read -r live_main_ref live_main_sha <<< "${main_ref_record}"
          if [ "${live_main_ref}" != "refs/heads/main" ] || [ -z "${live_main_sha}" ] || [ "${live_main_sha}" != "${EXPECTED_WORKFLOW_SHA}" ]; then
            echo "::error::Refusing payroll-timesheets deployment because workflow SHA is not immutable current main." >&2
            exit 1
          fi

      - name: Validate payroll-timesheets deploy prerequisites
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci/check-edge-deploy-prerequisites.mjs payroll-timesheets

      - name: Re-attest payroll-timesheets current main immediately before deploy
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_ref_record="$(gh api --method GET "repos/${GH_REPOSITORY}/git/ref/heads/main" --jq '[.ref, .object.sha] | @tsv')"
          IFS=$'\t' read -r live_main_ref live_main_sha <<< "${main_ref_record}"
          if [ "${live_main_ref}" != "refs/heads/main" ] || [ -z "${live_main_sha}" ] || [ "${live_main_sha}" != "${EXPECTED_WORKFLOW_SHA}" ]; then
            echo "::error::Refusing payroll-timesheets deployment because workflow SHA is not immutable current main." >&2
            exit 1
          fi

      - name: Deploy payroll-timesheets edge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci/deploy-payroll-timesheets-function.mjs

  deploy_payroll_export:
    name: deploy-payroll-export
    runs-on: ubuntu-latest
    needs:
      - policy
      - tenant_safety
      - runtime_migration_parity
      - lint_typecheck
      - unit_tests
      - build
      - auth_browser_smoke
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.actor_id == '129695080' && github.event.repository.owner.type == 'User' && github.event.repository.owner.login == github.repository_owner && github.event.repository.owner.id == 129695080 && inputs.approval_acknowledgement == 'I_APPROVE_WIN_219_PAYROLL_ACTIVATION' && inputs.activate_payroll_export == true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Attest payroll-export current main before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_ref_record="$(gh api --method GET "repos/${GH_REPOSITORY}/git/ref/heads/main" --jq '[.ref, .object.sha] | @tsv')"
          IFS=$'\t' read -r live_main_ref live_main_sha <<< "${main_ref_record}"
          if [ "${live_main_ref}" != "refs/heads/main" ] || [ -z "${live_main_sha}" ] || [ "${live_main_sha}" != "${EXPECTED_WORKFLOW_SHA}" ]; then
            echo "::error::Refusing payroll-export deployment because workflow SHA is not immutable current main." >&2
            exit 1
          fi

      - name: Validate payroll-export deploy prerequisites
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci/check-edge-deploy-prerequisites.mjs payroll-export

      - name: Re-attest payroll-export current main immediately before deploy
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_ref_record="$(gh api --method GET "repos/${GH_REPOSITORY}/git/ref/heads/main" --jq '[.ref, .object.sha] | @tsv')"
          IFS=$'\t' read -r live_main_ref live_main_sha <<< "${main_ref_record}"
          if [ "${live_main_ref}" != "refs/heads/main" ] || [ -z "${live_main_sha}" ] || [ "${live_main_sha}" != "${EXPECTED_WORKFLOW_SHA}" ]; then
            echo "::error::Refusing payroll-export deployment because workflow SHA is not immutable current main." >&2
            exit 1
          fi

      - name: Deploy payroll-export edge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci/deploy-payroll-export-function.mjs

  deploy_payroll_approvals:
    name: deploy-payroll-approvals
    runs-on: ubuntu-latest
    needs:
      - policy
      - tenant_safety
      - runtime_migration_parity
      - lint_typecheck
      - unit_tests
      - build
      - auth_browser_smoke
