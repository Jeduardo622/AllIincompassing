  tier0_browser:
    name: tier0-browser
    runs-on: ubuntu-latest
    needs:
      - build
      - change_scope
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Select tier-0 browser scope
        id: browser_scope
        env:
          BASE_SHA: ${{ needs.change_scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.change_scope.outputs.head_sha }}
        run: node scripts/ci/select-browser-checks.mjs --format github-output

      - name: Skip tier-0 browser gate
        if: steps.browser_scope.outputs.tier0_required != 'true'
        run: echo "No route, auth, or session browser surface changed; tier0-browser required check passes without Cypress."

      - name: Install dependencies
        if: steps.browser_scope.outputs.tier0_required == 'true'
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Download dist artifact
        if: steps.browser_scope.outputs.tier0_required == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: artifact-dist

      - name: Normalize dist artifact path
        if: steps.browser_scope.outputs.tier0_required == 'true'
        run: |
          rm -rf dist
          if [ -f "artifact-dist/index.html" ]; then
            mkdir -p dist
            cp -R artifact-dist/. dist/
          elif [ -f "artifact-dist/dist/index.html" ]; then
            mkdir -p dist
            cp -R artifact-dist/dist/. dist/
          else
            echo "dist artifact layout did not contain index.html"
            echo "artifact-dist contents:"
            ls -la artifact-dist || true
            echo "artifact-dist/dist contents:"
            ls -la artifact-dist/dist || true
            exit 1
          fi
          test -f "dist/index.html"

      - name: Tier-0 browser regression gate
        if: steps.browser_scope.outputs.tier0_required == 'true'
        run: npm run test:routes:tier0 -- --spec "${{ steps.browser_scope.outputs.tier0_specs }}"
        env:
          PREVIEW_OUTPUT_DIR: dist

      - name: Record tier-0 evidence
        if: always()
        run: npm run ci:write-evidence -- tier0-browser "${{ job.status }}"

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cypress-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cypress/screenshots
            cypress/videos
            artifacts/latest
          if-no-files-found: ignore

  auth_browser_smoke:
    name: auth-browser-smoke
    runs-on: ubuntu-latest
    needs:
      - policy
      - change_scope
      - deploy_session_edge
    if: always() && needs.change_scope.outputs.docs_only != 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.deploy_session_edge.result == 'success')
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Select auth browser scope
        id: browser_scope
        env:
          BASE_SHA: ${{ needs.change_scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.change_scope.outputs.head_sha }}
        run: node scripts/ci/select-browser-checks.mjs --format github-output

      - name: Skip auth browser smoke gate
        if: steps.browser_scope.outputs.auth_smoke_required != 'true'
        run: echo "No auth or session browser surface changed; auth-browser-smoke required check passes without Playwright."

      - name: Install dependencies
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Provision auth smoke admin
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/provision-ci-smoke-admin.ts

      - name: Provision synthetic BCBA smoke actor
        if: steps.browser_scope.outputs.auth_smoke_required == 'true' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: npx tsx scripts/provision-ci-smoke-bcba.ts

      - name: Install Playwright browser
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        run: npx playwright install --with-deps chromium

      - name: Auth browser smoke gate
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        env:
          PW_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--velvety-cendol-dae4d6.netlify.app', github.event.pull_request.number) || secrets.PW_BASE_URL }}
          PW_ADMIN_EMAIL: ${{ secrets.PW_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.PW_ADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.PW_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.PW_THERAPIST_PASSWORD }}
          PW_SCHEDULE_EMAIL: ${{ secrets.PW_SCHEDULE_EMAIL }}
          PW_SCHEDULE_PASSWORD: ${{ secrets.PW_SCHEDULE_PASSWORD }}
          PW_FOREIGN_CLIENT_ID: ${{ secrets.PW_FOREIGN_CLIENT_ID }}
          PW_FOREIGN_THERAPIST_ID: ${{ secrets.PW_FOREIGN_THERAPIST_ID }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          required=(
            PW_BASE_URL
            PW_THERAPIST_EMAIL
            PW_THERAPIST_PASSWORD
            PW_FOREIGN_CLIENT_ID
            PW_FOREIGN_THERAPIST_ID
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::warning::Missing auth smoke secrets on pull_request; skipping browser smoke gate: ${missing[*]}"
              exit 0
            fi
            echo "Missing required secrets for auth browser smoke gate: ${missing[*]}"
            exit 1
          fi
          export CI_SESSION_PARITY_REQUIRED=true
          echo "Running auth browser smoke."
          npm run playwright:auth

      - name: Session browser smoke gate
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        env:
          PW_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--velvety-cendol-dae4d6.netlify.app', github.event.pull_request.number) || secrets.PW_BASE_URL }}
          PW_ADMIN_EMAIL: ${{ secrets.PW_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.PW_ADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.PW_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.PW_THERAPIST_PASSWORD }}
          PW_SCHEDULE_EMAIL: ${{ secrets.PW_SCHEDULE_EMAIL }}
          PW_SCHEDULE_PASSWORD: ${{ secrets.PW_SCHEDULE_PASSWORD }}
          PW_FOREIGN_CLIENT_ID: ${{ secrets.PW_FOREIGN_CLIENT_ID }}
          PW_FOREIGN_THERAPIST_ID: ${{ secrets.PW_FOREIGN_THERAPIST_ID }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          required=(
            PW_BASE_URL
            PW_ADMIN_EMAIL
            PW_ADMIN_PASSWORD
            PW_THERAPIST_EMAIL
            PW_THERAPIST_PASSWORD
            PW_SCHEDULE_EMAIL
            PW_SCHEDULE_PASSWORD
            PW_FOREIGN_CLIENT_ID
            PW_FOREIGN_THERAPIST_ID
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::warning::Missing session smoke secrets on pull_request; skipping session browser smoke gate: ${missing[*]}"
              exit 0
            fi
            echo "Missing required secrets for session browser smoke gate: ${missing[*]}"
            exit 1
          fi
          export CI_SESSION_PARITY_REQUIRED=true
          export PW_CI_CHILD_TIMEOUT_MS=480000
          echo "Running required auth/session Playwright suite."
          npm run ci:playwright

      - name: BCBA session acceptance proof
        if: steps.browser_scope.outputs.auth_smoke_required == 'true' && github.event_name != 'pull_request'
        env:
          PW_BASE_URL: ${{ secrets.PW_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CI_SESSION_PARITY_REQUIRED: true
          PW_ASSERT_ALREADY_STARTED_UI: true
        run: |
          npm run playwright:session-lifecycle
          npm run playwright:session-note-measurement-roundtrip

      - name: Cleanup synthetic BCBA smoke actor
        if: always() && steps.browser_scope.outputs.auth_smoke_required == 'true' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/provision-ci-smoke-bcba.ts --cleanup

      - name: Cleanup auth smoke admin
        if: always() && steps.browser_scope.outputs.auth_smoke_required == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/provision-ci-smoke-admin.ts --cleanup

      - name: Record auth smoke evidence
        if: always()
        run: npm run ci:write-evidence -- auth-browser-smoke "${{ job.status }}"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/latest
          if-no-files-found: ignore

  playwright_env_readiness:
    name: playwright-env-readiness
    runs-on: ubuntu-latest
    needs:
      - policy
      - change_scope
    if: needs.change_scope.outputs.docs_only != 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Select Playwright readiness scope
        id: browser_scope
        env:
          BASE_SHA: ${{ needs.change_scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.change_scope.outputs.head_sha }}
        run: node scripts/ci/select-browser-checks.mjs --format github-output

      - name: Write skipped Playwright readiness artifact
        if: steps.browser_scope.outputs.auth_smoke_required != 'true'
        run: |
          mkdir -p artifacts/latest/readiness
          printf '%s\n' '{"report":"playwright-env-readiness","result":"not_validated","reason":"No auth/session Playwright browser surface changed; secret-backed readiness was not evaluated."}' > artifacts/latest/readiness/playwright-env-readiness.json
          printf '%s\n' '# Playwright Environment Readiness' '' '- result: `not_validated`' '- reason: No auth/session Playwright browser surface changed; secret-backed readiness was not evaluated.' > artifacts/latest/readiness/playwright-env-readiness.md

      - name: Write Playwright environment readiness report
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        env:
          PW_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--velvety-cendol-dae4d6.netlify.app', github.event.pull_request.number) || secrets.PW_BASE_URL }}
          PW_ADMIN_EMAIL: ${{ secrets.PW_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.PW_ADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.PW_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.PW_THERAPIST_PASSWORD }}
          PW_SCHEDULE_EMAIL: ${{ secrets.PW_SCHEDULE_EMAIL }}
          PW_SCHEDULE_PASSWORD: ${{ secrets.PW_SCHEDULE_PASSWORD }}
          PW_FOREIGN_CLIENT_ID: ${{ secrets.PW_FOREIGN_CLIENT_ID }}
          PW_FOREIGN_THERAPIST_ID: ${{ secrets.PW_FOREIGN_THERAPIST_ID }}
          PW_ASSESSMENT_CLIENT_ID: ${{ secrets.PW_ASSESSMENT_CLIENT_ID }}
          PW_ASSESSMENT_SAMPLE_FILE: ${{ secrets.PW_ASSESSMENT_SAMPLE_FILE }}
          PW_CLINICAL_QA_EMAIL: ${{ secrets.PW_CLINICAL_QA_EMAIL }}
          PW_CLINICAL_QA_PASSWORD: ${{ secrets.PW_CLINICAL_QA_PASSWORD }}
          PW_CLINICAL_QA_TARGET_MARKER: ${{ secrets.PW_CLINICAL_QA_TARGET_MARKER }}
          PW_CLINICAL_QA_CLIENT_ID: ${{ secrets.PW_CLINICAL_QA_CLIENT_ID }}
          PW_CLINICAL_QA_ROUTE: ${{ secrets.PW_CLINICAL_QA_ROUTE }}
          PW_CLINICAL_QA_SOURCE_FILE: ${{ secrets.PW_CLINICAL_QA_SOURCE_FILE }}
          PW_CLINICAL_QA_OUTPUT_FILE: ${{ secrets.PW_CLINICAL_QA_OUTPUT_FILE }}
          PW_CLINICAL_QA_EXPECTATIONS_FILE: ${{ secrets.PW_CLINICAL_QA_EXPECTATIONS_FILE }}
          PW_CLINICAL_QA_VISUAL_RUBRIC_FILE: ${{ secrets.PW_CLINICAL_QA_VISUAL_RUBRIC_FILE }}
          PW_CLINICAL_QA_GENERATED_OUTPUT_SELECTOR: ${{ secrets.PW_CLINICAL_QA_GENERATED_OUTPUT_SELECTOR }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run ci:playwright:env-readiness -- --fail-on-blocking

      - name: Upload Playwright readiness artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-env-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/latest/readiness
          if-no-files-found: error

  iehp_assessment_import_smoke:
    name: iehp-assessment-import-smoke
    runs-on: ubuntu-latest
    needs:
      - policy
      - change_scope
    if: needs.change_scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Select IEHP assessment import scope
        id: browser_scope
        env:
          BASE_SHA: ${{ needs.change_scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.change_scope.outputs.head_sha }}
        run: node scripts/ci/select-browser-checks.mjs --format github-output

      - name: Skip IEHP assessment import smoke gate
        if: steps.browser_scope.outputs.iehp_assessment_import_smoke_required != 'true'
        run: echo "No IEHP assessment import surface changed; IEHP assessment import smoke required check passes without Playwright."

      - name: Install dependencies
        if: steps.browser_scope.outputs.iehp_assessment_import_smoke_required == 'true'
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Provision IEHP smoke admin
        if: steps.browser_scope.outputs.iehp_assessment_import_smoke_required == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/provision-ci-smoke-admin.ts

      - name: Install Playwright browser
        if: steps.browser_scope.outputs.iehp_assessment_import_smoke_required == 'true'
        run: npx playwright install --with-deps chromium

      - name: IEHP assessment import smoke gate
        if: steps.browser_scope.outputs.iehp_assessment_import_smoke_required == 'true'
        env:
          PW_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--velvety-cendol-dae4d6.netlify.app', github.event.pull_request.number) || secrets.PW_BASE_URL }}
          PW_ASSESSMENT_CLIENT_ID: ${{ secrets.PW_ASSESSMENT_CLIENT_ID }}
          PW_ASSESSMENT_SAMPLE_FILE: ${{ secrets.PW_ASSESSMENT_SAMPLE_FILE }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          required=(
            PW_BASE_URL
            PW_SUPERADMIN_EMAIL
            PW_SUPERADMIN_PASSWORD
            PW_ASSESSMENT_CLIENT_ID
            PW_ASSESSMENT_SAMPLE_FILE
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets for IEHP assessment import smoke gate: ${missing[*]}"
            exit 1
          fi

          npm run playwright:iehp-assessment-import-smoke
          npm run playwright:iehp-assessment-import-skills-behaviors
          npm run playwright:iehp-assessment-import-generated-docx-parity

      - name: Cleanup IEHP smoke admin
        if: always() && steps.browser_scope.outputs.iehp_assessment_import_smoke_required == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/provision-ci-smoke-admin.ts --cleanup

      - name: Record IEHP import smoke evidence
        if: always()
        run: npm run ci:write-evidence -- iehp-assessment-import-smoke "${{ job.status }}"

      - name: Upload IEHP Playwright artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: iehp-playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/latest
          if-no-files-found: ignore

  optional_playwright_smoke:
    name: optional-playwright-smoke
    runs-on: ubuntu-latest
    needs:
      - policy
      - change_scope
    if: needs.change_scope.outputs.docs_only != 'true'
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: Optional Playwright smoke secret gate
        id: optional_gate
        shell: bash
        env:
          PW_OPTIONAL_PLAYWRIGHT_SMOKE: ${{ secrets.PW_OPTIONAL_PLAYWRIGHT_SMOKE }}
          PW_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--velvety-cendol-dae4d6.netlify.app', github.event.pull_request.number) || secrets.PW_BASE_URL }}
          PW_ADMIN_EMAIL: ${{ secrets.PW_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.PW_ADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.PW_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.PW_THERAPIST_PASSWORD }}
          PW_ASSESSMENT_CLIENT_ID: ${{ secrets.PW_ASSESSMENT_CLIENT_ID }}
          PW_ASSESSMENT_SAMPLE_FILE: ${{ secrets.PW_ASSESSMENT_SAMPLE_FILE }}
          PW_CLINICAL_QA_EMAIL: ${{ secrets.PW_CLINICAL_QA_EMAIL }}
          PW_CLINICAL_QA_PASSWORD: ${{ secrets.PW_CLINICAL_QA_PASSWORD }}
          PW_CLINICAL_QA_TARGET_MARKER: ${{ secrets.PW_CLINICAL_QA_TARGET_MARKER }}
          PW_CLINICAL_QA_CLIENT_ID: ${{ secrets.PW_CLINICAL_QA_CLIENT_ID }}
          PW_CLINICAL_QA_ROUTE: ${{ secrets.PW_CLINICAL_QA_ROUTE }}
          PW_CLINICAL_QA_SOURCE_FILE: ${{ secrets.PW_CLINICAL_QA_SOURCE_FILE }}
          PW_CLINICAL_QA_OUTPUT_FILE: ${{ secrets.PW_CLINICAL_QA_OUTPUT_FILE }}
          PW_CLINICAL_QA_EXPECTATIONS_FILE: ${{ secrets.PW_CLINICAL_QA_EXPECTATIONS_FILE }}
          PW_CLINICAL_QA_VISUAL_RUBRIC_FILE: ${{ secrets.PW_CLINICAL_QA_VISUAL_RUBRIC_FILE }}
          PW_CLINICAL_QA_GENERATED_OUTPUT_SELECTOR: ${{ secrets.PW_CLINICAL_QA_GENERATED_OUTPUT_SELECTOR }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/latest/evidence
          if [ "${PW_OPTIONAL_PLAYWRIGHT_SMOKE}" != "true" ]; then
            echo "run_optional=false" >> "${GITHUB_OUTPUT}"
            printf '%s\n' '{"evidence":"optional-playwright-smoke","status":"skipped","reason":"PW_OPTIONAL_PLAYWRIGHT_SMOKE is not true"}' > artifacts/latest/evidence/optional-playwright-smoke.json
            exit 0
          fi

          required=(
            PW_BASE_URL
            PW_ADMIN_EMAIL
            PW_ADMIN_PASSWORD
            PW_THERAPIST_EMAIL
            PW_THERAPIST_PASSWORD
            PW_ASSESSMENT_CLIENT_ID
            PW_ASSESSMENT_SAMPLE_FILE
            PW_CLINICAL_QA_TARGET_MARKER
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ -z "${PW_CLINICAL_QA_EMAIL}" ] || [ -z "${PW_CLINICAL_QA_PASSWORD}" ]; then
            if [ -z "${PW_ADMIN_EMAIL}" ] || [ -z "${PW_ADMIN_PASSWORD}" ]; then
              missing+=("PW_CLINICAL_QA_EMAIL/PW_CLINICAL_QA_PASSWORD or PW_ADMIN_EMAIL/PW_ADMIN_PASSWORD")
            fi
          fi
          if [ -z "${PW_CLINICAL_QA_CLIENT_ID}" ] && [ -z "${PW_CLINICAL_QA_ROUTE}" ]; then
            missing+=("PW_CLINICAL_QA_CLIENT_ID or PW_CLINICAL_QA_ROUTE")
          fi
          case "${PW_CLINICAL_QA_TARGET_MARKER}" in
            redacted|synthetic|smoke|test) ;;
            *) missing+=("PW_CLINICAL_QA_TARGET_MARKER must be redacted, synthetic, smoke, or test") ;;
          esac
          if [ -z "${PW_CLINICAL_QA_SOURCE_FILE}" ] && [ -z "${PW_CLINICAL_QA_EXPECTATIONS_FILE}" ]; then
            missing+=("PW_CLINICAL_QA_SOURCE_FILE or PW_CLINICAL_QA_EXPECTATIONS_FILE")
          fi
          if [ -z "${PW_CLINICAL_QA_OUTPUT_FILE}" ] && [ -z "${PW_CLINICAL_QA_GENERATED_OUTPUT_SELECTOR}" ]; then
            missing+=("PW_CLINICAL_QA_OUTPUT_FILE or PW_CLINICAL_QA_GENERATED_OUTPUT_SELECTOR")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required optional Playwright secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          echo "run_optional=true" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: steps.optional_gate.outputs.run_optional == 'true'
        run: node scripts/ci/npm-ci-with-retry.mjs

      - name: Install Playwright browser
        if: steps.optional_gate.outputs.run_optional == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run optional Playwright smoke suite
        if: steps.optional_gate.outputs.run_optional == 'true'
        env:
          PW_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--velvety-cendol-dae4d6.netlify.app', github.event.pull_request.number) || secrets.PW_BASE_URL }}
          PW_ADMIN_EMAIL: ${{ secrets.PW_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.PW_ADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.PW_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.PW_THERAPIST_PASSWORD }}
          PW_ASSESSMENT_CLIENT_ID: ${{ secrets.PW_ASSESSMENT_CLIENT_ID }}
          PW_ASSESSMENT_SAMPLE_FILE: ${{ secrets.PW_ASSESSMENT_SAMPLE_FILE }}
          PW_CLINICAL_QA_EMAIL: ${{ secrets.PW_CLINICAL_QA_EMAIL }}
          PW_CLINICAL_QA_PASSWORD: ${{ secrets.PW_CLINICAL_QA_PASSWORD }}
          PW_CLINICAL_QA_TARGET_MARKER: ${{ secrets.PW_CLINICAL_QA_TARGET_MARKER }}
          PW_CLINICAL_QA_CLIENT_ID: ${{ secrets.PW_CLINICAL_QA_CLIENT_ID }}
          PW_CLINICAL_QA_ROUTE: ${{ secrets.PW_CLINICAL_QA_ROUTE }}
          PW_CLINICAL_QA_SOURCE_FILE: ${{ secrets.PW_CLINICAL_QA_SOURCE_FILE }}
          PW_CLINICAL_QA_OUTPUT_FILE: ${{ secrets.PW_CLINICAL_QA_OUTPUT_FILE }}
          PW_CLINICAL_QA_EXPECTATIONS_FILE: ${{ secrets.PW_CLINICAL_QA_EXPECTATIONS_FILE }}
          PW_CLINICAL_QA_VISUAL_RUBRIC_FILE: ${{ secrets.PW_CLINICAL_QA_VISUAL_RUBRIC_FILE }}
          PW_CLINICAL_QA_GENERATED_OUTPUT_SELECTOR: ${{ secrets.PW_CLINICAL_QA_GENERATED_OUTPUT_SELECTOR }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run ci:playwright:optional-smoke

      - name: Record optional Playwright evidence
        if: always()
        run: npm run ci:write-evidence -- optional-playwright-smoke "${{ job.status }}"

      - name: Upload optional Playwright artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: optional-playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/latest
          if-no-files-found: ignore

  ci_gate:
    name: ci-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - change_scope
      - docs_guard
      - policy
      - tenant_safety
      - runtime_migration_parity
      - start_session_runtime_contract
      - deploy_session_edge
      - deploy_ai_agent_edge
      - deploy_payroll_timesheets
      - deploy_payroll_export
      - deploy_payroll_approvals
      - deploy_payroll_administration
      - lint_typecheck
      - unit_tests
      - build
      - tier0_browser
      - auth_browser_smoke
      - playwright_env_readiness
      - iehp_assessment_import_smoke
    steps:
      - name: Enforce lane-specific CI results
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          ACTIVATE_PAYROLL_TIMESHEETS: ${{ inputs.activate_payroll_timesheets || false }}
          ACTIVATE_PAYROLL_EXPORT: ${{ inputs.activate_payroll_export || false }}
          ACTIVATE_PAYROLL_APPROVALS: ${{ inputs.activate_payroll_approvals || false }}
          ACTIVATE_PAYROLL_ADMINISTRATION: ${{ inputs.activate_payroll_administration || false }}
          DOCS_ONLY: ${{ needs.change_scope.outputs.docs_only }}
          AI_AGENT_CHANGED: ${{ needs.change_scope.outputs.ai_agent_changed }}
          DOCS_GUARD_RESULT: ${{ needs.docs_guard.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          TENANT_SAFETY_RESULT: ${{ needs.tenant_safety.result }}
          RUNTIME_PARITY_RESULT: ${{ needs.runtime_migration_parity.result }}
          START_SESSION_RUNTIME_CONTRACT_RESULT: ${{ needs.start_session_runtime_contract.result }}
          DEPLOY_SESSION_EDGE_RESULT: ${{ needs.deploy_session_edge.result }}
          DEPLOY_AI_AGENT_EDGE_RESULT: ${{ needs.deploy_ai_agent_edge.result }}
          DEPLOY_PAYROLL_TIMESHEETS_RESULT: ${{ needs.deploy_payroll_timesheets.result }}
          DEPLOY_PAYROLL_EXPORT_RESULT: ${{ needs.deploy_payroll_export.result }}
          DEPLOY_PAYROLL_APPROVALS_RESULT: ${{ needs.deploy_payroll_approvals.result }}
          DEPLOY_PAYROLL_ADMINISTRATION_RESULT: ${{ needs.deploy_payroll_administration.result }}
          LINT_RESULT: ${{ needs.lint_typecheck.result }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TIER0_RESULT: ${{ needs.tier0_browser.result }}
          AUTH_SMOKE_RESULT: ${{ needs.auth_browser_smoke.result }}
          PLAYWRIGHT_ENV_RESULT: ${{ needs.playwright_env_readiness.result }}
          IEHP_IMPORT_SMOKE_RESULT: ${{ needs.iehp_assessment_import_smoke.result }}
        run: |
          set -euo pipefail
          echo "docs_only=${DOCS_ONLY}"

          if [ "${DOCS_ONLY}" = "true" ]; then
            if [ "${DOCS_GUARD_RESULT}" != "success" ]; then
              echo "docs-only run requires docs-guard=success but got ${DOCS_GUARD_RESULT}"
              exit 1
            fi
            echo "docs-only run passed via docs-guard."
            exit 0
          fi

          failed=()
          [ "${POLICY_RESULT}" = "success" ] || failed+=("policy=${POLICY_RESULT}")
          [ "${TENANT_SAFETY_RESULT}" = "success" ] || failed+=("tenant-safety=${TENANT_SAFETY_RESULT}")
          if { [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; } || { [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && { [ "${ACTIVATE_PAYROLL_TIMESHEETS}" = "true" ] || [ "${ACTIVATE_PAYROLL_ADMINISTRATION}" = "true" ] || [ "${ACTIVATE_PAYROLL_APPROVALS}" = "true" ] || [ "${ACTIVATE_PAYROLL_EXPORT}" = "true" ]; }; }; then
            [ "${RUNTIME_PARITY_RESULT}" = "success" ] || failed+=("runtime-migration-parity=${RUNTIME_PARITY_RESULT}")
          fi
          [ "${START_SESSION_RUNTIME_CONTRACT_RESULT}" = "success" ] || failed+=("start-session-runtime-contract=${START_SESSION_RUNTIME_CONTRACT_RESULT}")
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${DEPLOY_SESSION_EDGE_RESULT}" != "success" ]; then
            failed+=("deploy-session-edge=${DEPLOY_SESSION_EDGE_RESULT}")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${AI_AGENT_CHANGED}" = "true" ] && [ "${DEPLOY_AI_AGENT_EDGE_RESULT}" != "success" ]; then
            failed+=("deploy-ai-agent-edge=${DEPLOY_AI_AGENT_EDGE_RESULT}")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${ACTIVATE_PAYROLL_TIMESHEETS}" = "true" ] && [ "${DEPLOY_PAYROLL_TIMESHEETS_RESULT}" != "success" ]; then
            failed+=("deploy-payroll-timesheets=${DEPLOY_PAYROLL_TIMESHEETS_RESULT}")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${ACTIVATE_PAYROLL_EXPORT}" = "true" ] && [ "${DEPLOY_PAYROLL_EXPORT_RESULT}" != "success" ]; then
            failed+=("deploy-payroll-export=${DEPLOY_PAYROLL_EXPORT_RESULT}")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${ACTIVATE_PAYROLL_APPROVALS}" = "true" ] && [ "${DEPLOY_PAYROLL_APPROVALS_RESULT}" != "success" ]; then
            failed+=("deploy-payroll-approvals=${DEPLOY_PAYROLL_APPROVALS_RESULT}")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${ACTIVATE_PAYROLL_ADMINISTRATION}" = "true" ] && [ "${DEPLOY_PAYROLL_ADMINISTRATION_RESULT}" != "success" ]; then
            failed+=("deploy-payroll-administration=${DEPLOY_PAYROLL_ADMINISTRATION_RESULT}")
          fi
          [ "${LINT_RESULT}" = "success" ] || failed+=("lint-typecheck=${LINT_RESULT}")
          [ "${UNIT_RESULT}" = "success" ] || failed+=("unit-tests=${UNIT_RESULT}")
          [ "${BUILD_RESULT}" = "success" ] || failed+=("build=${BUILD_RESULT}")
          [ "${TIER0_RESULT}" = "success" ] || failed+=("tier0-browser=${TIER0_RESULT}")
          [ "${AUTH_SMOKE_RESULT}" = "success" ] || failed+=("auth-browser-smoke=${AUTH_SMOKE_RESULT}")
          [ "${PLAYWRIGHT_ENV_RESULT}" = "success" ] || failed+=("playwright-env-readiness=${PLAYWRIGHT_ENV_RESULT}")
          [ "${IEHP_IMPORT_SMOKE_RESULT}" = "success" ] || failed+=("iehp-assessment-import-smoke=${IEHP_IMPORT_SMOKE_RESULT}")

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "non-doc run failed required jobs: ${failed[*]}"
            exit 1
          fi

          echo "non-doc run passed full CI gate."
