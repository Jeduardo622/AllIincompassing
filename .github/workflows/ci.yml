name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  merge_group:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change_scope:
    name: change-scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
      ai_agent_changed: ${{ steps.detect.outputs.ai_agent_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect docs-only scope
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          base_sha=""
          head_sha="${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            base_sha="${{ github.event.before }}"
            head_sha="${GITHUB_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            base_sha="${{ github.event.merge_group.base_sha }}"
            head_sha="${{ github.event.merge_group.head_sha }}"
          fi

          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

          # Fall back to full pipeline if diff metadata is unavailable.
          if [ -z "${base_sha}" ] || [ "${base_sha}" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            echo "ai_agent_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"
          if [ -z "${changed_files}" ]; then
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            echo "ai_agent_changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          docs_only=true
          ai_agent_changed=false
          while IFS= read -r file; do
            if ! printf '%s\n' "${file}" | grep -Eq '^(docs/.*\.md$|reports/.*\.md$|README.*\.md$|AGENTS\.md$|\.agents/skills/.*/SKILL\.md$|\.cursor/skills/.*/SKILL\.md$)'; then
              docs_only=false
            fi
            if printf '%s\n' "${file}" | grep -Eq '^supabase/functions/(ai-agent-optimized/|_shared/(database|auth|org|logging|cors|supabaseEnv|requestAuthHeaders)\.ts$|lib/http/error\.ts$)'; then
              ai_agent_changed=true
            fi
          done <<< "${changed_files}"

          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "ai_agent_changed=${ai_agent_changed}" >> "${GITHUB_OUTPUT}"
          echo "Detected docs_only=${docs_only}"
          echo "Detected ai_agent_changed=${ai_agent_changed}"

  docs_guard:
    name: docs-guard
    runs-on: ubuntu-latest
    needs: change_scope
    if: needs.change_scope.outputs.docs_only == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate npm run examples in changed docs
        shell: bash
        env:
          BASE_SHA: ${{ needs.change_scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.change_scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
            echo "Missing diff SHAs; skipping docs command validation."
            exit 0
          fi

          mapfile -t changed_docs < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '^(docs/.*\.md$|reports/.*\.md$|README.*\.md$|AGENTS\.md$|\.agents/skills/.*/SKILL\.md$|\.cursor/skills/.*/SKILL\.md$)' || true)
          if [ "${#changed_docs[@]}" -eq 0 ]; then
            echo "No tracked docs files changed."
            exit 0
          fi

          node - "${changed_docs[@]}" <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const scripts = new Set(Object.keys(pkg.scripts ?? {}));
          const files = process.argv.slice(2);
          const missing = [];
          const re = /npm run ([a-zA-Z0-9:_-]+)/g;

          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const text = fs.readFileSync(file, 'utf8');
            let match;
            while ((match = re.exec(text)) !== null) {
              if (!scripts.has(match[1])) {
                missing.push({ file, command: match[1] });
              }
            }
          }

          if (missing.length > 0) {
            console.error('Found non-existent npm scripts in docs:');
            for (const item of missing) {
              console.error(`- ${item.file}: npm run ${item.command}`);
            }
            process.exit(1);
          }

          console.log(`Validated npm run examples in ${files.length} docs file(s).`);
          NODE

  policy:
    name: policy
    runs-on: ubuntu-latest
    needs: change_scope
    if: needs.change_scope.outputs.docs_only != 'true'
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets policy
        run: npm run ci:secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORGANIZATION: ${{ secrets.OPENAI_ORGANIZATION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_JWT_ORG_A: ${{ secrets.TEST_JWT_ORG_A }}
          TEST_JWT_ORG_B: ${{ secrets.TEST_JWT_ORG_B }}
          TEST_JWT_SUPER_ADMIN: ${{ secrets.TEST_JWT_SUPER_ADMIN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_STAGING_SITE_ID: ${{ secrets.NETLIFY_STAGING_SITE_ID }}
          NETLIFY_PRODUCTION_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}

      - name: Policy checks
        run: npm run ci:check-focused
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PROTECTED_BRANCHES: "main"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CI_SUPABASE_AUTH_PARITY_REQUIRED: "true"
          CI_EDGE_ROUTE_PARITY_REQUIRED: "true"
          SUPABASE_FUNCTION_PARITY_SCOPE: "sessions-book,sessions-hold,sessions-confirm,sessions-start,sessions-cancel,generate-session-notes-pdf,session-notes-pdf-status,session-notes-pdf-download,programs,goals,goal-targets,program-notes"
          CI_RLS_OVERLAP_REQUIRED: ${{ secrets.SUPABASE_DB_URL != '' && 'true' || 'false' }}
          CI_REQUIRED_CHECKS: "ci-gate"
          API_AUTHORITY_MODE: "edge"
          RATE_LIMIT_MODE: "memory"

  tenant_safety:
    name: tenant-safety
    runs-on: ubuntu-latest
    needs: policy
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tenant isolation
        run: npm run validate:tenant

  runtime_migration_parity:
    name: runtime-migration-parity
    runs-on: ubuntu-latest
    needs:
      - policy
      - change_scope
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check runtime migration parity
        env:
          MIGRATION_PARITY_BASE_SHA: ${{ needs.change_scope.outputs.base_sha }}
          MIGRATION_PARITY_HEAD_SHA: ${{ needs.change_scope.outputs.head_sha }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/ci/check-runtime-migration-parity.mjs

  start_session_runtime_contract:
    name: start-session-runtime-contract
    runs-on: ubuntu-latest
    needs: policy
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check start_session_with_goals runtime contract
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/ci/check-session-runtime-contract.mjs

  deploy_session_edge:
    name: deploy-session-edge
    runs-on: ubuntu-latest
    needs:
      - policy
      - tenant_safety
      - runtime_migration_parity
      - start_session_runtime_contract
      - lint_typecheck
      - unit_tests
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate session edge deploy prerequisites
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci/check-edge-deploy-prerequisites.mjs session-edge

      - name: Deploy required session edge functions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run ci:deploy:session-edge-bundle

      - name: Deploy fill-docs with static templates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run ci:deploy:fill-docs-function

  deploy_ai_agent_edge:
    name: deploy-ai-agent-edge
    runs-on: ubuntu-latest
    needs:
      - deploy_session_edge
      - change_scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.change_scope.outputs.ai_agent_changed == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate AI agent edge deploy prerequisites
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ci/check-edge-deploy-prerequisites.mjs ai-agent-optimized

      - name: Deploy ai-agent-optimized edge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run ci:deploy:ai-agent-function

  lint_typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    needs: policy
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  unit_tests:
    name: unit-tests
    runs-on: ubuntu-latest
    needs: policy
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests + coverage
        run: npm run test:ci
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          # Required for CI-only Supabase security/integration suites.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify coverage thresholds
        run: npm run ci:verify-coverage

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint_typecheck, unit_tests]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build canary
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  tier0_browser:
    name: tier0-browser
    runs-on: ubuntu-latest
    needs:
      - build
      - change_scope
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Select tier-0 browser scope
        id: browser_scope
        env:
          BASE_SHA: ${{ needs.change_scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.change_scope.outputs.head_sha }}
        run: node scripts/ci/select-browser-checks.mjs --format github-output

      - name: Skip tier-0 browser gate
        if: steps.browser_scope.outputs.tier0_required != 'true'
        run: echo "No route, auth, or session browser surface changed; tier0-browser required check passes without Cypress."

      - name: Install dependencies
        if: steps.browser_scope.outputs.tier0_required == 'true'
        run: npm ci

      - name: Download dist artifact
        if: steps.browser_scope.outputs.tier0_required == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: artifact-dist

      - name: Normalize dist artifact path
        if: steps.browser_scope.outputs.tier0_required == 'true'
        run: |
          rm -rf dist
          if [ -f "artifact-dist/index.html" ]; then
            mkdir -p dist
            cp -R artifact-dist/. dist/
          elif [ -f "artifact-dist/dist/index.html" ]; then
            mkdir -p dist
            cp -R artifact-dist/dist/. dist/
          else
            echo "dist artifact layout did not contain index.html"
            echo "artifact-dist contents:"
            ls -la artifact-dist || true
            echo "artifact-dist/dist contents:"
            ls -la artifact-dist/dist || true
            exit 1
          fi
          test -f "dist/index.html"

      - name: Tier-0 browser regression gate
        if: steps.browser_scope.outputs.tier0_required == 'true'
        run: npm run test:routes:tier0 -- --spec "${{ steps.browser_scope.outputs.tier0_specs }}"
        env:
          PREVIEW_OUTPUT_DIR: dist

      - name: Record tier-0 evidence
        if: always()
        run: npm run ci:write-evidence -- tier0-browser "${{ job.status }}"

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cypress-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cypress/screenshots
            cypress/videos
            artifacts/latest
          if-no-files-found: ignore

  auth_browser_smoke:
    name: auth-browser-smoke
    runs-on: ubuntu-latest
    needs:
      - policy
      - change_scope
      - deploy_session_edge
    if: always() && needs.change_scope.outputs.docs_only != 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.deploy_session_edge.result == 'success')
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Select auth browser scope
        id: browser_scope
        env:
          BASE_SHA: ${{ needs.change_scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.change_scope.outputs.head_sha }}
        run: node scripts/ci/select-browser-checks.mjs --format github-output

      - name: Skip auth browser smoke gate
        if: steps.browser_scope.outputs.auth_smoke_required != 'true'
        run: echo "No auth or session browser surface changed; auth-browser-smoke required check passes without Playwright."

      - name: Install dependencies
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        run: npm ci

      - name: Provision auth smoke admin
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/provision-ci-smoke-admin.ts

      - name: Provision synthetic BCBA smoke actor
        if: steps.browser_scope.outputs.auth_smoke_required == 'true' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: npx tsx scripts/provision-ci-smoke-bcba.ts

      - name: Install Playwright browser
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        run: npx playwright install --with-deps chromium

      - name: Auth browser smoke gate
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        env:
          PW_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--velvety-cendol-dae4d6.netlify.app', github.event.pull_request.number) || secrets.PW_BASE_URL }}
          PW_ADMIN_EMAIL: ${{ secrets.PW_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.PW_ADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.PW_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.PW_THERAPIST_PASSWORD }}
          PW_SCHEDULE_EMAIL: ${{ secrets.PW_SCHEDULE_EMAIL }}
          PW_SCHEDULE_PASSWORD: ${{ secrets.PW_SCHEDULE_PASSWORD }}
          PW_FOREIGN_CLIENT_ID: ${{ secrets.PW_FOREIGN_CLIENT_ID }}
          PW_FOREIGN_THERAPIST_ID: ${{ secrets.PW_FOREIGN_THERAPIST_ID }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          required=(
            PW_BASE_URL
            PW_THERAPIST_EMAIL
            PW_THERAPIST_PASSWORD
            PW_FOREIGN_CLIENT_ID
            PW_FOREIGN_THERAPIST_ID
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::warning::Missing auth smoke secrets on pull_request; skipping browser smoke gate: ${missing[*]}"
              exit 0
            fi
            echo "Missing required secrets for auth browser smoke gate: ${missing[*]}"
            exit 1
          fi
          export CI_SESSION_PARITY_REQUIRED=true
          echo "Running auth browser smoke."
          npm run playwright:auth

      - name: Session browser smoke gate
        if: steps.browser_scope.outputs.auth_smoke_required == 'true'
        env:
          PW_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--velvety-cendol-dae4d6.netlify.app', github.event.pull_request.number) || secrets.PW_BASE_URL }}
          PW_ADMIN_EMAIL: ${{ secrets.PW_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.PW_ADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.PW_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.PW_THERAPIST_PASSWORD }}
          PW_SCHEDULE_EMAIL: ${{ secrets.PW_SCHEDULE_EMAIL }}
          PW_SCHEDULE_PASSWORD: ${{ secrets.PW_SCHEDULE_PASSWORD }}
          PW_FOREIGN_CLIENT_ID: ${{ secrets.PW_FOREIGN_CLIENT_ID }}
          PW_FOREIGN_THERAPIST_ID: ${{ secrets.PW_FOREIGN_THERAPIST_ID }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          required=(
            PW_BASE_URL
            PW_THERAPIST_EMAIL
            PW_THERAPIST_PASSWORD
            PW_FOREIGN_CLIENT_ID
            PW_FOREIGN_THERAPIST_ID
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::warning::Missing session smoke secrets on pull_request; skipping session browser smoke gate: ${missing[*]}"
              exit 0
            fi
            echo "Missing required secrets for session browser smoke gate: ${missing[*]}"
            exit 1
          fi
          export CI_SESSION_PARITY_REQUIRED=true
          export PW_CI_CHILD_TIMEOUT_MS=480000
          echo "Running non-AI session browser smoke suite."
          npm run ci:playwright:session-smoke

      - name: BCBA session acceptance proof
        if: steps.browser_scope.outputs.auth_smoke_required == 'true' && github.event_name != 'pull_request'
        env:
          PW_BASE_URL: ${{ secrets.PW_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CI_SESSION_PARITY_REQUIRED: true
          PW_ASSERT_ALREADY_STARTED_UI: true
        run: |
          npm run playwright:session-lifecycle
          npm run playwright:session-note-measurement-roundtrip

      - name: Cleanup synthetic BCBA smoke actor
        if: always() && steps.browser_scope.outputs.auth_smoke_required == 'true' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/provision-ci-smoke-bcba.ts --cleanup

      - name: Cleanup auth smoke admin
        if: always() && steps.browser_scope.outputs.auth_smoke_required == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/provision-ci-smoke-admin.ts --cleanup

      - name: Record auth smoke evidence
        if: always()
        run: npm run ci:write-evidence -- auth-browser-smoke "${{ job.status }}"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/latest
          if-no-files-found: ignore

  playwright_env_readiness:
