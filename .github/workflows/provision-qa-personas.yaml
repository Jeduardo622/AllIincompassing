name: Provision Persistent QA Personas

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      pull_request_number:
        description: Merged WIN-43 pull request
        required: true
        type: string
      approval_acknowledgement:
        description: Exact owner approval acknowledgement
        required: true
        type: string
      operation:
        description: Bounded protected operation
        required: true
        default: verify-readiness
        type: choice
        options:
          - verify-readiness
          - provision-empty-namespace

permissions:
  actions: read
  contents: read

concurrency:
  group: provision-persistent-qa-personas-main
  cancel-in-progress: false

jobs:
  provision:
    name: Provision and verify synthetic QA personas
    if: >-
      github.actor == github.repository_owner &&
      github.actor_id == '129695080' &&
      github.event.repository.owner.type == 'User' &&
      github.event.repository.owner.login == github.repository_owner &&
      github.event.repository.owner.id == 129695080
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Validate owner approval, exact main, CI, and review route
        id: approval
        env:
          APPROVAL_ACKNOWLEDGEMENT: ${{ inputs.approval_acknowledgement }}
          CI_HELPER_PATH: ${{ runner.temp }}/resolve-required-ci-evidence.mjs
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > "${CI_HELPER_PATH}" <<'EOF'
          const requiredCiChecks = ['policy', 'lint-typecheck', 'unit-tests', 'build', 'tier0-browser', 'auth-browser-smoke', 'ci-gate'];
          const docsOnlyCiChecks = ['change-scope', 'docs-guard', 'ci-gate'];
          const maxDocsOnlyCommits = 10;
          const docsOnlyPathPattern = /^(docs\/.*\.md|reports\/.*\.md|README.*\.md|AGENTS\.md|\.agents\/skills\/.*\/SKILL\.md|\.cursor\/skills\/.*\/SKILL\.md)$/;

          const headers = () => ({
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          });

          const fetchJson = async (url, label) => {
            const response = await fetch(url, { headers: headers() });
            if (!response.ok) throw new Error(`Unable to validate ${label}: HTTP ${response.status}.`);
            const linkHeader = response.headers.get('link') ?? '';
            return { payload: await response.json(), linkHeader };
          };

          const fetchAll = async (urlForPage, label, select = (value) => value) => {
            const values = [];
            for (let page = 1; page <= 20; page += 1) {
              const { payload } = await fetchJson(urlForPage(page), `${label} page ${page}`);
              const items = select(payload);
              if (!Array.isArray(items)) throw new Error(`${label} is not an array.`);
              values.push(...items);
              if (items.length < 100) return values;
            }
            throw new Error(`${label} pagination exceeded the fail-closed limit.`);
          };

          const getCommit = async (repository, sha) => {
            const { payload: commit, linkHeader } = await fetchJson(
              `https://api.github.com/repos/${repository}/commits/${sha}`,
              `commit ${sha}`,
            );
            if (/\brel="next"\b/.test(linkHeader)) {
              throw new Error(`Commit ${sha} file pagination is unsupported for docs-only CI evidence.`);
            }
            return commit;
          };

          const validateDocsOnlyCommit = (commit, sha) => {
            if (commit.parents?.length !== 1) {
              throw new Error(`Commit ${sha} is not a single-parent commit; docs-only CI evidence cannot cross merges.`);
            }
            if (!Array.isArray(commit.files) || commit.files.length === 0) {
              throw new Error(`Commit ${sha} has no changed files; docs-only CI evidence requires a nonempty commit.`);
            }
            for (const file of commit.files) {
              const filenames = [String(file.filename ?? '')];
              if (file.previous_filename !== undefined) {
                filenames.push(String(file.previous_filename));
              }
              for (const filename of filenames) {
                if (!docsOnlyPathPattern.test(filename)) {
                  throw new Error(`Commit ${sha} is not docs-only by the exact ci.yml allowlist: ${filename}.`);
                }
              }
            }
          };

          const getCiRunEvidence = async (repository, sha) => {
            const runs = await fetchAll(
              (page) => `https://api.github.com/repos/${repository}/actions/workflows/ci.yml/runs?per_page=100&page=${page}&event=push&branch=main&head_sha=${sha}`,
              'CI workflow runs',
              (payload) => payload.workflow_runs,
            );
            const matchingRuns = runs.filter(
              (run) =>
                run.head_sha === sha
                && run.event === 'push'
                && run.head_branch === 'main',
            );
            if (matchingRuns.length !== 1) {
              throw new Error(`Ambiguous CI workflow runs for ${sha}: expected exactly one exact-SHA main push run.`);
            }
            const [run] = matchingRuns;
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error(`CI workflow run ${run.id ?? 'unknown'} for ${sha} is not completed successfully.`);
            }
            const jobs = await fetchAll(
              (page) => `https://api.github.com/repos/${repository}/actions/runs/${run.id}/jobs?filter=latest&per_page=100&page=${page}`,
              `CI workflow run ${run.id} jobs`,
              (payload) => payload.jobs,
            );
            return { run, jobs };
          };

          const hasSuccessfulChecks = (jobs, expectedChecks, label, sha) => {
            for (const checkName of expectedChecks) {
              const matchingJobs = jobs.filter((job) => job.name === checkName);
              if (matchingJobs.length > 1) {
                throw new Error(`${label} for ${sha} has ambiguous ${checkName} jobs.`);
              }
              if (matchingJobs.length === 0) {
                return false;
              }
              const [job] = matchingJobs;
              if (job.status !== 'completed' || job.conclusion !== 'success') {
                return false;
              }
            }
            return true;
          };

          export async function resolveRequiredCiEvidence(repository, startingSha) {
            let candidateSha = startingSha;
            for (let depth = 0; depth <= maxDocsOnlyCommits; depth += 1) {
              const evidence = await getCiRunEvidence(repository, candidateSha);
              if (hasSuccessfulChecks(
                evidence.jobs,
                requiredCiChecks,
                'current-main CI evidence',
                candidateSha,
              )) {
                return { resolvedCiSha: candidateSha, runId: evidence.run.id };
              }
              if (depth === maxDocsOnlyCommits) {
                throw new Error('docs-only ancestry exceeded the fail-closed limit before finding full CI evidence.');
              }
              const commit = await getCommit(repository, candidateSha);
              validateDocsOnlyCommit(commit, candidateSha);
              if (!hasSuccessfulChecks(
                evidence.jobs,
                docsOnlyCiChecks,
                'docs-only CI evidence',
                candidateSha,
              )) {
                throw new Error(`docs-only CI evidence is missing for ${candidateSha}.`);
              }
              candidateSha = String(commit.parents[0]?.sha ?? '');
              if (!/^[0-9a-f]{40}$/.test(candidateSha)) {
                throw new Error(`Commit ${commit.sha ?? startingSha} has an invalid parent SHA.`);
              }
            }
            throw new Error('Unable to resolve required CI evidence.');
          }
          EOF
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';

          const { resolveRequiredCiEvidence } = await import(pathToFileURL(process.env.CI_HELPER_PATH).href);

          const expectedAcknowledgement = 'I_APPROVE_WIN_43_QA_PERSONA_PROVISIONING';
          const acknowledgement = process.env.APPROVAL_ACKNOWLEDGEMENT ?? '';
          const commitSha = process.env.COMMIT_SHA ?? '';
          const operation = process.env.OPERATION ?? '';
          const pullRequestNumber = process.env.PULL_REQUEST_NUMBER ?? '';
          const repository = process.env.REPOSITORY ?? '';

          if (acknowledgement !== expectedAcknowledgement) {
            throw new Error('Exact WIN-43 protected execution acknowledgement is required.');
          }
          if (!['verify-readiness', 'provision-empty-namespace'].includes(operation)) {
            throw new Error('Unsupported QA persona operation.');
          }
          if (!/^[0-9a-f]{40}$/.test(commitSha)) {
            throw new Error('commit_sha must be exactly 40 lowercase hexadecimal characters.');
          }
          if (!/^[1-9][0-9]*$/.test(pullRequestNumber)) {
            throw new Error('pull_request_number must be a positive integer.');
          }
          if (process.env.GITHUB_REF !== 'refs/heads/main') {
            throw new Error('Protected persona provisioning must use the main workflow ref.');
          }
          if (process.env.GITHUB_ACTOR !== process.env.GITHUB_REPOSITORY_OWNER) {
            throw new Error('Only the repository owner may approve persona provisioning.');
          }
          if (process.env.GITHUB_ACTOR_ID !== '129695080') {
            throw new Error('Repository owner numeric identity mismatch.');
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const fetchJson = async (url, label) => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`Unable to validate ${label}: HTTP ${response.status}.`);
            return response.json();
          };
          const fetchAll = async (urlForPage, label, select = (value) => value) => {
            const values = [];
            for (let page = 1; page <= 20; page += 1) {
              const items = select(await fetchJson(urlForPage(page), label));
              if (!Array.isArray(items)) throw new Error(`${label} is not an array.`);
              values.push(...items);
              if (items.length < 100) return values;
            }
            throw new Error(`${label} pagination exceeded the fail-closed limit.`);
          };
          const getContent = async (repositoryPath) => {
            const encoded = repositoryPath.split('/').map(encodeURIComponent).join('/');
            const payload = await fetchJson(`https://api.github.com/repos/${repository}/contents/${encoded}?ref=${commitSha}`, repositoryPath);
            if (Array.isArray(payload) || payload.type !== 'file' || payload.encoding !== 'base64') throw new Error(`${repositoryPath} is not a file.`);
            return Buffer.from(String(payload.content ?? '').replace(/\s/g, ''), 'base64');
          };

          const [repositoryRecord, mainRef, pull] = await Promise.all([
            fetchJson(`https://api.github.com/repos/${repository}`, 'repository'),
            fetchJson(`https://api.github.com/repos/${repository}/git/ref/heads/main`, 'main ref'),
            fetchJson(`https://api.github.com/repos/${repository}/pulls/${pullRequestNumber}`, 'pull request'),
          ]);
          if (
            repositoryRecord.owner?.type !== 'User'
            || repositoryRecord.owner?.login !== process.env.GITHUB_REPOSITORY_OWNER
            || String(repositoryRecord.owner?.id ?? '') !== '129695080'
          ) {
            throw new Error('Live repository ownership does not match the protected owner identity.');
          }
          if (mainRef.ref !== 'refs/heads/main' || mainRef.object?.sha !== commitSha) {
            throw new Error('commit_sha must equal immutable current main.');
          }
          if (
            pull.state !== 'closed'
            || pull.merged !== true
            || !pull.merged_at
            || pull.base?.ref !== 'main'
            || pull.head?.repo?.full_name !== repository
            || pull.merge_commit_sha !== commitSha
          ) {
            throw new Error('Approval pull request must be the reviewed merge at current main.');
          }
          if (!/(^|[^A-Z0-9])WIN-43([^A-Z0-9]|$)/i.test(`${pull.title ?? ''}\n${pull.body ?? ''}`)) {
            throw new Error('Approval pull request must reference WIN-43.');
          }
          const { resolvedCiSha } = await resolveRequiredCiEvidence(repository, commitSha);

          if (
            repositoryRecord.owner?.type !== 'User'
            || repositoryRecord.owner?.login !== process.env.GITHUB_REPOSITORY_OWNER
            || String(repositoryRecord.owner?.id) !== process.env.GITHUB_ACTOR_ID
          ) {
            throw new Error('Solo-maintainer owner identity mismatch.');
          }
          const collaborators = await fetchAll(
            (page) => `https://api.github.com/repos/${repository}/collaborators?affiliation=direct&per_page=100&page=${page}`,
            'collaborators',
          );
          const maintainers = collaborators.filter((value) => value.type === 'User' && (value.permissions?.admin || value.permissions?.maintain || value.permissions?.push));
          if (maintainers.length !== 1 || maintainers[0]?.login !== process.env.GITHUB_REPOSITORY_OWNER || String(maintainers[0]?.id) !== process.env.GITHUB_ACTOR_ID) {
            throw new Error('Solo-maintainer topology is unavailable.');
          }

          const attestationPath = 'docs/ai/reviews/WIN-43-qa-persona-delegated-browser-dispatch-attestation.json';
          const attestationBytes = await getContent(attestationPath);
          const attestationSha256 = createHash('sha256').update(attestationBytes).digest('hex');
          const attestation = JSON.parse(attestationBytes.toString('utf8'));
          const specialists = ['code-review-engineer', 'security-engineer', 'test-engineer', 'software-architect', 'supabase-reviewer', 'devops-engineer'];
          if (attestation.schemaVersion !== 1 || attestation.issue !== 'WIN-43' || attestation.reviewMode !== 'solo-maintainer-owner-attestation' || attestation.repository !== repository) {
            throw new Error('QA persona delegated-dispatch attestation identity is invalid.');
          }
          if (specialists.some((name) => attestation.specialistReviews?.[name]?.verdict !== 'PASS')) {
            throw new Error('Passing specialist attestations are incomplete.');
          }
          const surfaces = [
            '.github/workflows/provision-qa-personas.yaml',
            'scripts/provision-persistent-qa-personas.ts',
            'scripts/playwright-qa-persona-readiness.ts',
            'scripts/lib/playwright-smoke.ts',
            'tests/scripts/provision-persistent-qa-personas.test.ts',
            'tests/scripts/playwright-qa-persona-readiness.test.ts',
            'tests/workflows/provision-qa-personas.test.ts',
            'tests/agentWorkLedgerDelegatedBrowserDispatchPolicy.test.ts',
            'AGENTS.md',
            '.agents/skills/route-task/SKILL.md',
            'docs/ai/cto-lane-contract.md',
            'docs/ai/high-risk-paths.md',
            'docs/ai/WIN-43-persistent-qa-personas-handoff.md',
            'docs/ai/WIN-43-qa-audit-credential-handoff.md',
            'docs/ai/handoffs/WIN-275-stale-edge-secret-cleanup.md',
            'docs/ai/handoffs/WIN-275-hosted-advisory-canary.md',
            'docs/ai/reviews/WIN-275-stale-edge-secret-cleanup-attestation.md',
            'docs/ai/reviews/WIN-275-hosted-advisory-canary-attestation.md',
            'docs/ai/reviews/WIN-275-stale-edge-secret-cleanup-solo-maintainer-attestation.json',
            'docs/ai/reviews/WIN-275-hosted-advisory-canary-solo-maintainer-attestation.json',
            'docs/ai/reviews/WIN-275-solo-maintainer-attestation.json',
          ];
          for (const surface of surfaces) {
            const expected = attestation.protectedSurfaceHashes?.[surface];
            const actual = createHash('sha256').update(await getContent(surface)).digest('hex');
            if (!/^[0-9a-f]{64}$/.test(expected ?? '') || actual !== expected) {
              throw new Error(`Protected surface hash drifted: ${surface}.`);
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `validated_sha=${commitSha}\nvalidated_ci_sha=${resolvedCiSha}\nattestation_sha256=${attestationSha256}\n`);
          NODE

      - name: Check out immutable reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.approval.outputs.validated_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Revalidate authority immediately before protected credentials
        env:
          CI_HELPER_PATH: ${{ runner.temp }}/resolve-required-ci-evidence.mjs
          EXPECTED_SHA: ${{ steps.approval.outputs.validated_sha }}
          EXPECTED_CI_SHA: ${{ steps.approval.outputs.validated_ci_sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { pathToFileURL } from 'node:url';

          const { resolveRequiredCiEvidence } = await import(pathToFileURL(process.env.CI_HELPER_PATH).href);
          const headers = { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const fetchJson = async (url, label) => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`Unable to revalidate ${label}: HTTP ${response.status}.`);
            return response.json();
          };
          const fetchAll = async (urlForPage, label, select = (value) => value) => {
            const values = [];
            for (let page = 1; page <= 20; page += 1) {
              const items = select(await fetchJson(urlForPage(page), label));
              if (!Array.isArray(items)) throw new Error(`${label} is not an array.`);
              values.push(...items);
              if (items.length < 100) return values;
            }
            throw new Error(`${label} pagination exceeded the fail-closed limit.`);
          };
          const mainRef = await fetchJson(`https://api.github.com/repos/${process.env.REPOSITORY}/git/ref/heads/main`, 'main ref');
          if (mainRef.object?.sha !== process.env.EXPECTED_SHA) throw new Error('Current main changed before protected credentials.');
          if (process.env.GITHUB_ACTOR !== process.env.GITHUB_REPOSITORY_OWNER) throw new Error('Persona provisioning actor changed before protected credentials.');
          const { resolvedCiSha } = await resolveRequiredCiEvidence(process.env.REPOSITORY, process.env.EXPECTED_SHA);
          if (resolvedCiSha !== process.env.EXPECTED_CI_SHA) throw new Error('Resolved CI evidence changed before protected credentials.');
          const repositoryDetails = await fetchJson(`https://api.github.com/repos/${process.env.REPOSITORY}`, 'repository identity');
          if (repositoryDetails.owner?.type !== 'User' || repositoryDetails.owner?.login !== process.env.GITHUB_REPOSITORY_OWNER || String(repositoryDetails.owner?.id) !== process.env.GITHUB_ACTOR_ID) throw new Error('Solo-maintainer identity changed before protected credentials.');
          const collaborators = await fetchAll((page) => `https://api.github.com/repos/${process.env.REPOSITORY}/collaborators?affiliation=direct&per_page=100&page=${page}`, 'collaborators');
          const maintainers = collaborators.filter((value) => value.type === 'User' && (value.permissions?.admin || value.permissions?.maintain || value.permissions?.push));
          if (maintainers.length !== 1 || maintainers[0]?.login !== process.env.GITHUB_REPOSITORY_OWNER || String(maintainers[0]?.id) !== process.env.GITHUB_ACTOR_ID) throw new Error('Solo-maintainer topology changed before protected credentials.');
          NODE

      - name: Provision and verify persistent synthetic QA personas
        if: inputs.operation == 'provision-empty-namespace'
        env:
          PW_ADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_PASSWORD }}
          PW_ADMIN_SCHEDULE_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_EMAIL }}
          PW_ADMIN_SCHEDULE_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_PASSWORD }}
          PW_BCBA_EMAIL: ${{ secrets.QA_BOOTSTRAP_BCBA_EMAIL }}
          PW_BCBA_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BCBA_PASSWORD }}
          PW_BT_EMAIL: ${{ secrets.QA_BOOTSTRAP_BT_EMAIL }}
          PW_BT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BT_PASSWORD }}
          PW_CLIENT_EMAIL: ${{ secrets.QA_BOOTSTRAP_CLIENT_EMAIL }}
          PW_CLIENT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_CLIENT_PASSWORD }}
          PW_MIDTIER_EMAIL: ${{ secrets.QA_BOOTSTRAP_MIDTIER_EMAIL }}
          PW_MIDTIER_PASSWORD: ${{ secrets.QA_BOOTSTRAP_MIDTIER_PASSWORD }}
          PW_SUPERADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_EMAIL }}
          PW_SUPERADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.QA_BOOTSTRAP_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.QA_BOOTSTRAP_THERAPIST_PASSWORD }}
          QA_PERSONA_MANIFEST_PATH: artifacts/win-43/qa-persona-manifest.json
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npx tsx scripts/provision-persistent-qa-personas.ts --provision

      - name: Verify current bootstrap credentials and tenant graph
        if: inputs.operation == 'verify-readiness'
        env:
          PW_ADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_PASSWORD }}
          PW_ADMIN_SCHEDULE_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_EMAIL }}
          PW_ADMIN_SCHEDULE_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_PASSWORD }}
          PW_BCBA_EMAIL: ${{ secrets.QA_BOOTSTRAP_BCBA_EMAIL }}
          PW_BCBA_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BCBA_PASSWORD }}
          PW_BT_EMAIL: ${{ secrets.QA_BOOTSTRAP_BT_EMAIL }}
          PW_BT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BT_PASSWORD }}
          PW_CLIENT_EMAIL: ${{ secrets.QA_BOOTSTRAP_CLIENT_EMAIL }}
          PW_CLIENT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_CLIENT_PASSWORD }}
          PW_MIDTIER_EMAIL: ${{ secrets.QA_BOOTSTRAP_MIDTIER_EMAIL }}
          PW_MIDTIER_PASSWORD: ${{ secrets.QA_BOOTSTRAP_MIDTIER_PASSWORD }}
          PW_SUPERADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_EMAIL }}
          PW_SUPERADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.QA_BOOTSTRAP_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.QA_BOOTSTRAP_THERAPIST_PASSWORD }}
          QA_PERSONA_MANIFEST_PATH: ${{ runner.temp }}/qa-persona-preverify-manifest.json
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npx tsx scripts/provision-persistent-qa-personas.ts --verify

      - name: Install Playwright Chromium for readiness
        if: inputs.operation == 'verify-readiness'
        run: npx playwright install --with-deps chromium

      - name: Verify route-entry readiness across eight persistent QA personas
        if: inputs.operation == 'verify-readiness'
        env:
          PW_ADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_PASSWORD }}
          PW_ADMIN_SCHEDULE_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_EMAIL }}
          PW_ADMIN_SCHEDULE_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_PASSWORD }}
          PW_BASE_URL: ${{ secrets.PW_BASE_URL }}
          PW_BCBA_EMAIL: ${{ secrets.QA_BOOTSTRAP_BCBA_EMAIL }}
          PW_BCBA_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BCBA_PASSWORD }}
          PW_BT_EMAIL: ${{ secrets.QA_BOOTSTRAP_BT_EMAIL }}
          PW_BT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BT_PASSWORD }}
          PW_CLIENT_EMAIL: ${{ secrets.QA_BOOTSTRAP_CLIENT_EMAIL }}
          PW_CLIENT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_CLIENT_PASSWORD }}
          PW_MIDTIER_EMAIL: ${{ secrets.QA_BOOTSTRAP_MIDTIER_EMAIL }}
          PW_MIDTIER_PASSWORD: ${{ secrets.QA_BOOTSTRAP_MIDTIER_PASSWORD }}
          PW_SUPERADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_EMAIL }}
          PW_SUPERADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.QA_BOOTSTRAP_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.QA_BOOTSTRAP_THERAPIST_PASSWORD }}
          QA_PERSONA_READINESS_MANIFEST_PATH: artifacts/win-43/qa-persona-readiness-manifest.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npx tsx scripts/playwright-qa-persona-readiness.ts

      - name: Upload sanitized provisioning manifest
        if: inputs.operation == 'provision-empty-namespace' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: win-43-qa-persona-manifest
          path: artifacts/win-43/qa-persona-manifest.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload sanitized readiness manifest
        if: inputs.operation == 'verify-readiness' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: win-43-qa-persona-readiness-manifest
          path: artifacts/win-43/qa-persona-readiness-manifest.json
          if-no-files-found: warn
          retention-days: 7
