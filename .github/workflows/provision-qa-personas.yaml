name: Provision Persistent QA Personas

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      pull_request_number:
        description: Merged WIN-43 pull request
        required: true
        type: string
      approval_acknowledgement:
        description: Exact owner approval acknowledgement
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provision-persistent-qa-personas-main
  cancel-in-progress: false

jobs:
  provision:
    name: Provision and verify synthetic QA personas
    if: >-
      github.actor == github.repository_owner &&
      github.actor_id == '129695080' &&
      github.event.repository.owner.type == 'User' &&
      github.event.repository.owner.login == github.repository_owner &&
      github.event.repository.owner.id == 129695080
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate owner approval and immutable reviewed main SHA
        env:
          APPROVAL_ACKNOWLEDGEMENT: ${{ inputs.approval_acknowledgement }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const expectedAcknowledgement = 'I_APPROVE_WIN_43_QA_PERSONA_PROVISIONING';
          const acknowledgement = process.env.APPROVAL_ACKNOWLEDGEMENT ?? '';
          const commitSha = process.env.COMMIT_SHA ?? '';
          const pullRequestNumber = process.env.PULL_REQUEST_NUMBER ?? '';
          const repository = process.env.REPOSITORY ?? '';

          if (acknowledgement !== expectedAcknowledgement) {
            throw new Error('Exact WIN-43 protected execution acknowledgement is required.');
          }
          if (!/^[0-9a-f]{40}$/.test(commitSha)) {
            throw new Error('commit_sha must be exactly 40 lowercase hexadecimal characters.');
          }
          if (!/^[1-9][0-9]*$/.test(pullRequestNumber)) {
            throw new Error('pull_request_number must be a positive integer.');
          }
          if (process.env.GITHUB_REF !== 'refs/heads/main') {
            throw new Error('Protected persona provisioning must use the main workflow ref.');
          }
          if (process.env.GITHUB_ACTOR !== process.env.GITHUB_REPOSITORY_OWNER) {
            throw new Error('Only the repository owner may approve persona provisioning.');
          }
          if (process.env.GITHUB_ACTOR_ID !== '129695080') {
            throw new Error('Repository owner numeric identity mismatch.');
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const fetchJson = async (url, label) => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`Unable to validate ${label}: HTTP ${response.status}.`);
            return response.json();
          };

          const [repositoryRecord, mainRef, pull] = await Promise.all([
            fetchJson(`https://api.github.com/repos/${repository}`, 'repository'),
            fetchJson(`https://api.github.com/repos/${repository}/git/ref/heads/main`, 'main ref'),
            fetchJson(`https://api.github.com/repos/${repository}/pulls/${pullRequestNumber}`, 'pull request'),
          ]);
          if (
            repositoryRecord.owner?.type !== 'User'
            || repositoryRecord.owner?.login !== process.env.GITHUB_REPOSITORY_OWNER
            || String(repositoryRecord.owner?.id ?? '') !== '129695080'
          ) {
            throw new Error('Live repository ownership does not match the protected owner identity.');
          }
          if (mainRef.ref !== 'refs/heads/main' || mainRef.object?.sha !== commitSha) {
            throw new Error('commit_sha must equal immutable current main.');
          }
          if (
            pull.state !== 'closed'
            || pull.merged !== true
            || !pull.merged_at
            || pull.base?.ref !== 'main'
            || pull.head?.repo?.full_name !== repository
            || pull.merge_commit_sha !== commitSha
          ) {
            throw new Error('Approval pull request must be the reviewed merge at current main.');
          }
          if (!/(^|[^A-Z0-9])WIN-43([^A-Z0-9]|$)/i.test(`${pull.title ?? ''}\n${pull.body ?? ''}`)) {
            throw new Error('Approval pull request must reference WIN-43.');
          }
          NODE

      - name: Check out immutable reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Re-attest current main immediately before protected credentials
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          live_main_sha="$(gh api "repos/${GH_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${live_main_sha}" = "${COMMIT_SHA}"

      - name: Provision and verify persistent synthetic QA personas
        env:
          PW_ADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_PASSWORD }}
          PW_ADMIN_SCHEDULE_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_EMAIL }}
          PW_ADMIN_SCHEDULE_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_PASSWORD }}
          PW_BCBA_EMAIL: ${{ secrets.QA_BOOTSTRAP_BCBA_EMAIL }}
          PW_BCBA_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BCBA_PASSWORD }}
          PW_BT_EMAIL: ${{ secrets.QA_BOOTSTRAP_BT_EMAIL }}
          PW_BT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BT_PASSWORD }}
          PW_CLIENT_EMAIL: ${{ secrets.QA_BOOTSTRAP_CLIENT_EMAIL }}
          PW_CLIENT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_CLIENT_PASSWORD }}
          PW_MIDTIER_EMAIL: ${{ secrets.QA_BOOTSTRAP_MIDTIER_EMAIL }}
          PW_MIDTIER_PASSWORD: ${{ secrets.QA_BOOTSTRAP_MIDTIER_PASSWORD }}
          PW_SUPERADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_EMAIL }}
          PW_SUPERADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.QA_BOOTSTRAP_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.QA_BOOTSTRAP_THERAPIST_PASSWORD }}
          QA_PERSONA_MANIFEST_PATH: artifacts/win-43/qa-persona-manifest.json
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npx tsx scripts/provision-persistent-qa-personas.ts --provision

      - name: Upload sanitized provisioning manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: win-43-qa-persona-manifest
          path: artifacts/win-43/qa-persona-manifest.json
          if-no-files-found: error
          retention-days: 7
