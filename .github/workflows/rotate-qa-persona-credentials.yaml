name: Rotate Persistent QA Persona Credentials

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      pull_request_number:
        description: Merged WIN-43 pull request
        required: true
        type: string
      approval_acknowledgement:
        description: Exact owner approval acknowledgement
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rotate-persistent-qa-persona-credentials-main
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate and verify synthetic QA persona credentials
    if: >-
      github.actor == github.repository_owner &&
      github.actor_id == '129695080' &&
      github.event.repository.owner.type == 'User' &&
      github.event.repository.owner.login == github.repository_owner &&
      github.event.repository.owner.id == 129695080
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Validate owner approval, exact main, CI, merged review route, and rotation attestation
        id: approval
        env:
          APPROVAL_ACKNOWLEDGEMENT: ${{ inputs.approval_acknowledgement }}
          BRANCH_PROTECTION_READ_TOKEN: ${{ secrets.QA_ROTATION_GITHUB_ADMIN_READ_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';

          const expectedAcknowledgement = 'I_APPROVE_WIN_43_QA_PERSONA_CREDENTIAL_ROTATION';
          const acknowledgement = process.env.APPROVAL_ACKNOWLEDGEMENT ?? '';
          const commitSha = process.env.COMMIT_SHA ?? '';
          const pullRequestNumber = process.env.PULL_REQUEST_NUMBER ?? '';
          const repository = process.env.REPOSITORY ?? '';

          if (acknowledgement !== expectedAcknowledgement) {
            throw new Error('Exact WIN-43 credential rotation acknowledgement is required.');
          }
          if (!/^[0-9a-f]{40}$/.test(commitSha)) {
            throw new Error('commit_sha must be exactly 40 lowercase hexadecimal characters.');
          }
          if (!/^[1-9][0-9]*$/.test(pullRequestNumber)) {
            throw new Error('pull_request_number must be a positive integer.');
          }
          if (process.env.GITHUB_REF !== 'refs/heads/main') {
            throw new Error('Credential rotation must use the main workflow ref.');
          }
          if (process.env.GITHUB_ACTOR !== process.env.GITHUB_REPOSITORY_OWNER) {
            throw new Error('Only the repository owner may approve QA persona credential rotation.');
          }
          if (process.env.GITHUB_ACTOR_ID !== '129695080') {
            throw new Error('Repository owner numeric identity mismatch.');
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const fetchJson = async (url, label, requestHeaders = headers) => {
            const response = await fetch(url, { headers: requestHeaders });
            if (!response.ok) throw new Error(`Unable to validate ${label}: HTTP ${response.status}.`);
            return response.json();
          };
          const fetchAll = async (urlForPage, label, select = (value) => value) => {
            const values = [];
            for (let page = 1; page <= 20; page += 1) {
              const items = select(await fetchJson(urlForPage(page), label));
              if (!Array.isArray(items)) throw new Error(`${label} is not an array.`);
              values.push(...items);
              if (items.length < 100) return values;
            }
            throw new Error(`${label} pagination exceeded the fail-closed limit.`);
          };
          const getContent = async (repositoryPath) => {
            const encoded = repositoryPath.split('/').map(encodeURIComponent).join('/');
            const payload = await fetchJson(`https://api.github.com/repos/${repository}/contents/${encoded}?ref=${commitSha}`, repositoryPath);
            if (Array.isArray(payload) || payload.type !== 'file' || payload.encoding !== 'base64') throw new Error(`${repositoryPath} is not a file.`);
            return Buffer.from(String(payload.content ?? '').replace(/\s/g, ''), 'base64');
          };

          const [repositoryRecord, mainRef, pull] = await Promise.all([
            fetchJson(`https://api.github.com/repos/${repository}`, 'repository'),
            fetchJson(`https://api.github.com/repos/${repository}/git/ref/heads/main`, 'main ref'),
            fetchJson(`https://api.github.com/repos/${repository}/pulls/${pullRequestNumber}`, 'pull request'),
          ]);
          if (
            repositoryRecord.owner?.type !== 'User'
            || repositoryRecord.owner?.login !== process.env.GITHUB_REPOSITORY_OWNER
            || String(repositoryRecord.owner?.id ?? '') !== '129695080'
          ) {
            throw new Error('Live repository ownership does not match the protected owner identity.');
          }
          if (mainRef.ref !== 'refs/heads/main' || mainRef.object?.sha !== commitSha) {
            throw new Error('commit_sha must equal immutable current main.');
          }
          if (
            pull.state !== 'closed'
            || pull.merged !== true
            || !pull.merged_at
            || pull.base?.ref !== 'main'
            || pull.head?.repo?.full_name !== repository
            || pull.merge_commit_sha !== commitSha
          ) {
            throw new Error('Approval pull request must be the reviewed merge at current main.');
          }
          if (!/(^|[^A-Z0-9])WIN-43([^A-Z0-9]|$)/i.test(`${pull.title ?? ''}\n${pull.body ?? ''}`)) {
            throw new Error('Approval pull request must reference WIN-43.');
          }

          const mainCheckRuns = await fetchAll(
            (page) => `https://api.github.com/repos/${repository}/commits/${commitSha}/check-runs?per_page=100&page=${page}`,
            'current main check runs',
            (payload) => payload.check_runs,
          );
          const requiredStatusChecks = await fetchJson(
            `https://api.github.com/repos/${repository}/branches/main/protection/required_status_checks`,
            'live main required status checks',
            { ...headers, Authorization: `Bearer ${process.env.BRANCH_PROTECTION_READ_TOKEN}` },
          );
          if (requiredStatusChecks.strict !== true) throw new Error('Live main required status checks are not strict.');
          const requiredCiChecks = (requiredStatusChecks.checks ?? []).map((check) => ({
            name: check.context,
            appId: check.app_id,
          }));
          if (!requiredCiChecks.length || requiredCiChecks.some((check) => typeof check.name !== 'string' || !check.name)) {
            throw new Error('Live main required status check policy is empty or invalid.');
          }
          const missingMain = requiredCiChecks.filter((required) => !mainCheckRuns.some((check) => check.name === required.name && check.head_sha === commitSha && (required.appId == null || check.app?.id === required.appId) && check.status === 'completed' && check.conclusion === 'success'));
          if (missingMain.length) throw new Error(`Current-main required CI is missing: ${missingMain.map((check) => check.name).join(', ')}.`);

          const collaborators = await fetchAll(
            (page) => `https://api.github.com/repos/${repository}/collaborators?affiliation=direct&per_page=100&page=${page}`,
            'collaborators',
          );
          const maintainers = collaborators.filter((value) => value.type === 'User' && (value.permissions?.admin || value.permissions?.maintain || value.permissions?.push));
          if (maintainers.length !== 1 || maintainers[0]?.login !== process.env.GITHUB_REPOSITORY_OWNER || String(maintainers[0]?.id) !== process.env.GITHUB_ACTOR_ID) {
            throw new Error('Solo-maintainer topology is unavailable.');
          }

          const attestationPath = 'docs/ai/reviews/WIN-43-qa-persona-credential-rotation-attestation.json';
          const attestationBytes = await getContent(attestationPath);
          const attestationSha256 = createHash('sha256').update(attestationBytes).digest('hex');
          const attestation = JSON.parse(attestationBytes.toString('utf8'));
          const specialists = ['code-review-engineer', 'security-engineer', 'test-engineer', 'software-architect', 'supabase-reviewer', 'devops-engineer'];
          if (attestation.schemaVersion !== 1 || attestation.issue !== 'WIN-43' || attestation.reviewMode !== 'solo-maintainer-owner-attestation' || attestation.repository !== repository) {
            throw new Error('QA persona credential rotation attestation identity is invalid.');
          }
          if (specialists.some((name) => attestation.specialistReviews?.[name]?.verdict !== 'PASS')) {
            throw new Error('Passing specialist rotation attestations are incomplete.');
          }
          const surfaces = [
            '.github/workflows/rotate-qa-persona-credentials.yaml',
            'scripts/provision-persistent-qa-personas.ts',
            'scripts/rotate-persistent-qa-persona-credentials.ts',
            'tests/scripts/provision-persistent-qa-personas.test.ts',
            'tests/scripts/rotate-persistent-qa-persona-credentials.test.ts',
            'tests/workflows/rotate-qa-persona-credentials.test.ts',
            'AGENTS.md',
            '.agents/skills/route-task/SKILL.md',
            'docs/ai/cto-lane-contract.md',
            'docs/ai/high-risk-paths.md',
            'docs/ai/WIN-43-persistent-qa-personas-handoff.md',
          ];
          for (const surface of surfaces) {
            const expected = attestation.protectedSurfaceHashes?.[surface];
            const actual = createHash('sha256').update(await getContent(surface)).digest('hex');
            if (!/^[0-9a-f]{64}$/.test(expected ?? '') || actual !== expected) {
              throw new Error(`Protected surface hash drifted: ${surface}.`);
            }
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `validated_sha=${commitSha}\nattestation_sha256=${attestationSha256}\n`);
          NODE
        shell: bash

      - name: Check out immutable reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.approval.outputs.validated_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Revalidate authority immediately before protected credentials
        env:
          EXPECTED_SHA: ${{ steps.approval.outputs.validated_sha }}
          BRANCH_PROTECTION_READ_TOKEN: ${{ secrets.QA_ROTATION_GITHUB_ADMIN_READ_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const headers = { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const fetchJson = async (url, label, requestHeaders = headers) => {
            const response = await fetch(url, { headers: requestHeaders });
            if (!response.ok) throw new Error(`Unable to revalidate ${label}: HTTP ${response.status}.`);
            return response.json();
          };
          const fetchAll = async (urlForPage, label, select = (value) => value) => {
            const values = [];
            for (let page = 1; page <= 20; page += 1) {
              const items = select(await fetchJson(urlForPage(page), label));
              if (!Array.isArray(items)) throw new Error(`${label} is not an array.`);
              values.push(...items);
              if (items.length < 100) return values;
            }
            throw new Error(`${label} pagination exceeded the fail-closed limit.`);
          };
          const mainRef = await fetchJson(`https://api.github.com/repos/${process.env.REPOSITORY}/git/ref/heads/main`, 'main ref');
          if (mainRef.object?.sha !== process.env.EXPECTED_SHA) throw new Error('Current main changed before protected credentials.');
          if (process.env.GITHUB_ACTOR !== process.env.GITHUB_REPOSITORY_OWNER) throw new Error('Credential rotation actor changed before protected credentials.');
          const mainCheckRuns = await fetchAll((page) => `https://api.github.com/repos/${process.env.REPOSITORY}/commits/${process.env.EXPECTED_SHA}/check-runs?per_page=100&page=${page}`, 'current main check runs', (payload) => payload.check_runs);
          const requiredStatusChecks = await fetchJson(
            `https://api.github.com/repos/${process.env.REPOSITORY}/branches/main/protection/required_status_checks`,
            'live main required status checks',
            { ...headers, Authorization: `Bearer ${process.env.BRANCH_PROTECTION_READ_TOKEN}` },
          );
          if (requiredStatusChecks.strict !== true) throw new Error('Live main required status checks are no longer strict.');
          const requiredCiChecks = (requiredStatusChecks.checks ?? []).map((check) => ({ name: check.context, appId: check.app_id }));
          if (!requiredCiChecks.length || requiredCiChecks.some((check) => typeof check.name !== 'string' || !check.name)) throw new Error('Live main required status check policy is empty or invalid.');
          const missingMain = requiredCiChecks.filter((required) => !mainCheckRuns.some((check) => check.name === required.name && check.head_sha === process.env.EXPECTED_SHA && (required.appId == null || check.app?.id === required.appId) && check.status === 'completed' && check.conclusion === 'success'));
          if (missingMain.length) throw new Error(`Current-main required CI changed before protected credentials: ${missingMain.map((check) => check.name).join(', ')}.`);
          const repositoryDetails = await fetchJson(`https://api.github.com/repos/${process.env.REPOSITORY}`, 'repository identity');
          if (repositoryDetails.owner?.type !== 'User' || repositoryDetails.owner?.login !== process.env.GITHUB_REPOSITORY_OWNER || String(repositoryDetails.owner?.id) !== process.env.GITHUB_ACTOR_ID) throw new Error('Solo-maintainer identity changed before protected credentials.');
          const collaborators = await fetchAll((page) => `https://api.github.com/repos/${process.env.REPOSITORY}/collaborators?affiliation=direct&per_page=100&page=${page}`, 'collaborators');
          const maintainers = collaborators.filter((value) => value.type === 'User' && (value.permissions?.admin || value.permissions?.maintain || value.permissions?.push));
          if (maintainers.length !== 1 || maintainers[0]?.login !== process.env.GITHUB_REPOSITORY_OWNER || String(maintainers[0]?.id) !== process.env.GITHUB_ACTOR_ID) throw new Error('Solo-maintainer topology changed before protected credentials.');
          NODE

      - name: Preverify current bootstrap credentials and tenant graph
        env:
          PW_ADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_PASSWORD }}
          PW_ADMIN_SCHEDULE_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_EMAIL }}
          PW_ADMIN_SCHEDULE_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_PASSWORD }}
          PW_BCBA_EMAIL: ${{ secrets.QA_BOOTSTRAP_BCBA_EMAIL }}
          PW_BCBA_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BCBA_PASSWORD }}
          PW_BT_EMAIL: ${{ secrets.QA_BOOTSTRAP_BT_EMAIL }}
          PW_BT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BT_PASSWORD }}
          PW_CLIENT_EMAIL: ${{ secrets.QA_BOOTSTRAP_CLIENT_EMAIL }}
          PW_CLIENT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_CLIENT_PASSWORD }}
          PW_MIDTIER_EMAIL: ${{ secrets.QA_BOOTSTRAP_MIDTIER_EMAIL }}
          PW_MIDTIER_PASSWORD: ${{ secrets.QA_BOOTSTRAP_MIDTIER_PASSWORD }}
          PW_SCHEDULE_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_EMAIL }}
          PW_SCHEDULE_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_PASSWORD }}
          PW_SUPERADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_EMAIL }}
          PW_SUPERADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.QA_BOOTSTRAP_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.QA_BOOTSTRAP_THERAPIST_PASSWORD }}
          QA_PERSONA_MANIFEST_PATH: artifacts/win-43/qa-persona-preverify-manifest.json
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npx tsx scripts/provision-persistent-qa-personas.ts --verify

      - name: Rotate staged synthetic QA persona credentials
        env:
          QA_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_EMAIL }}
          QA_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_PASSWORD }}
          QA_BOOTSTRAP_ADMIN_SCHEDULE_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_EMAIL }}
          QA_BOOTSTRAP_ADMIN_SCHEDULE_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_PASSWORD }}
          QA_BOOTSTRAP_BCBA_EMAIL: ${{ secrets.QA_BOOTSTRAP_BCBA_EMAIL }}
          QA_BOOTSTRAP_BCBA_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BCBA_PASSWORD }}
          QA_BOOTSTRAP_BT_EMAIL: ${{ secrets.QA_BOOTSTRAP_BT_EMAIL }}
          QA_BOOTSTRAP_BT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_BT_PASSWORD }}
          QA_BOOTSTRAP_CLIENT_EMAIL: ${{ secrets.QA_BOOTSTRAP_CLIENT_EMAIL }}
          QA_BOOTSTRAP_CLIENT_PASSWORD: ${{ secrets.QA_BOOTSTRAP_CLIENT_PASSWORD }}
          QA_BOOTSTRAP_MIDTIER_EMAIL: ${{ secrets.QA_BOOTSTRAP_MIDTIER_EMAIL }}
          QA_BOOTSTRAP_MIDTIER_PASSWORD: ${{ secrets.QA_BOOTSTRAP_MIDTIER_PASSWORD }}
          QA_BOOTSTRAP_SCHEDULE_EMAIL: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_EMAIL }}
          QA_BOOTSTRAP_SCHEDULE_PASSWORD: ${{ secrets.QA_BOOTSTRAP_ADMIN_SCHEDULE_PASSWORD }}
          QA_BOOTSTRAP_SUPERADMIN_EMAIL: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_EMAIL }}
          QA_BOOTSTRAP_SUPERADMIN_PASSWORD: ${{ secrets.QA_BOOTSTRAP_SUPERADMIN_PASSWORD }}
          QA_BOOTSTRAP_THERAPIST_EMAIL: ${{ secrets.QA_BOOTSTRAP_THERAPIST_EMAIL }}
          QA_BOOTSTRAP_THERAPIST_PASSWORD: ${{ secrets.QA_BOOTSTRAP_THERAPIST_PASSWORD }}
          QA_ROTATION_ADMIN_EMAIL: ${{ secrets.QA_ROTATION_ADMIN_EMAIL }}
          QA_ROTATION_ADMIN_PASSWORD: ${{ secrets.QA_ROTATION_ADMIN_PASSWORD }}
          QA_ROTATION_ADMIN_SCHEDULE_EMAIL: ${{ secrets.QA_ROTATION_ADMIN_SCHEDULE_EMAIL }}
          QA_ROTATION_ADMIN_SCHEDULE_PASSWORD: ${{ secrets.QA_ROTATION_ADMIN_SCHEDULE_PASSWORD }}
          QA_ROTATION_BCBA_EMAIL: ${{ secrets.QA_ROTATION_BCBA_EMAIL }}
          QA_ROTATION_BCBA_PASSWORD: ${{ secrets.QA_ROTATION_BCBA_PASSWORD }}
          QA_ROTATION_BT_EMAIL: ${{ secrets.QA_ROTATION_BT_EMAIL }}
          QA_ROTATION_BT_PASSWORD: ${{ secrets.QA_ROTATION_BT_PASSWORD }}
          QA_ROTATION_CLIENT_EMAIL: ${{ secrets.QA_ROTATION_CLIENT_EMAIL }}
          QA_ROTATION_CLIENT_PASSWORD: ${{ secrets.QA_ROTATION_CLIENT_PASSWORD }}
          QA_ROTATION_MIDTIER_EMAIL: ${{ secrets.QA_ROTATION_MIDTIER_EMAIL }}
          QA_ROTATION_MIDTIER_PASSWORD: ${{ secrets.QA_ROTATION_MIDTIER_PASSWORD }}
          QA_ROTATION_SCHEDULE_EMAIL: ${{ secrets.QA_ROTATION_ADMIN_SCHEDULE_EMAIL }}
          QA_ROTATION_SCHEDULE_PASSWORD: ${{ secrets.QA_ROTATION_ADMIN_SCHEDULE_PASSWORD }}
          QA_ROTATION_SUPERADMIN_EMAIL: ${{ secrets.QA_ROTATION_SUPERADMIN_EMAIL }}
          QA_ROTATION_SUPERADMIN_PASSWORD: ${{ secrets.QA_ROTATION_SUPERADMIN_PASSWORD }}
          QA_ROTATION_THERAPIST_EMAIL: ${{ secrets.QA_ROTATION_THERAPIST_EMAIL }}
          QA_ROTATION_THERAPIST_PASSWORD: ${{ secrets.QA_ROTATION_THERAPIST_PASSWORD }}
          QA_PERSONA_MANIFEST_PATH: artifacts/win-43/qa-persona-rotation-manifest.json
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npx tsx scripts/rotate-persistent-qa-persona-credentials.ts --rotate

      - name: Postverify rotated credentials and tenant graph
        env:
          PW_ADMIN_EMAIL: ${{ secrets.QA_ROTATION_ADMIN_EMAIL }}
          PW_ADMIN_PASSWORD: ${{ secrets.QA_ROTATION_ADMIN_PASSWORD }}
          PW_ADMIN_SCHEDULE_EMAIL: ${{ secrets.QA_ROTATION_ADMIN_SCHEDULE_EMAIL }}
          PW_ADMIN_SCHEDULE_PASSWORD: ${{ secrets.QA_ROTATION_ADMIN_SCHEDULE_PASSWORD }}
          PW_BCBA_EMAIL: ${{ secrets.QA_ROTATION_BCBA_EMAIL }}
          PW_BCBA_PASSWORD: ${{ secrets.QA_ROTATION_BCBA_PASSWORD }}
          PW_BT_EMAIL: ${{ secrets.QA_ROTATION_BT_EMAIL }}
          PW_BT_PASSWORD: ${{ secrets.QA_ROTATION_BT_PASSWORD }}
          PW_CLIENT_EMAIL: ${{ secrets.QA_ROTATION_CLIENT_EMAIL }}
          PW_CLIENT_PASSWORD: ${{ secrets.QA_ROTATION_CLIENT_PASSWORD }}
          PW_MIDTIER_EMAIL: ${{ secrets.QA_ROTATION_MIDTIER_EMAIL }}
          PW_MIDTIER_PASSWORD: ${{ secrets.QA_ROTATION_MIDTIER_PASSWORD }}
          PW_SCHEDULE_EMAIL: ${{ secrets.QA_ROTATION_ADMIN_SCHEDULE_EMAIL }}
          PW_SCHEDULE_PASSWORD: ${{ secrets.QA_ROTATION_ADMIN_SCHEDULE_PASSWORD }}
          PW_SUPERADMIN_EMAIL: ${{ secrets.QA_ROTATION_SUPERADMIN_EMAIL }}
          PW_SUPERADMIN_PASSWORD: ${{ secrets.QA_ROTATION_SUPERADMIN_PASSWORD }}
          PW_THERAPIST_EMAIL: ${{ secrets.QA_ROTATION_THERAPIST_EMAIL }}
          PW_THERAPIST_PASSWORD: ${{ secrets.QA_ROTATION_THERAPIST_PASSWORD }}
          QA_PERSONA_MANIFEST_PATH: artifacts/win-43/qa-persona-postverify-manifest.json
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npx tsx scripts/provision-persistent-qa-personas.ts --verify

      - name: Upload sanitized rotation verification manifests
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: win-43-qa-persona-rotation-manifests
          path: |
            artifacts/win-43/qa-persona-preverify-manifest.json
            artifacts/win-43/qa-persona-rotation-manifest.json
            artifacts/win-43/qa-persona-postverify-manifest.json
          if-no-files-found: error
          retention-days: 7
