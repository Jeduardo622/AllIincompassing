name: tenant-safety

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/server/**'
      - 'src/lib/auth*'
      - 'src/lib/runtimeConfig*'
      - 'scripts/ci/**'
      - '.github/workflows/**'
      - 'netlify.toml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/server/**'
      - 'src/lib/auth*'
      - 'src/lib/runtimeConfig*'
      - 'scripts/ci/**'
      - '.github/workflows/**'
      - 'netlify.toml'

jobs:
  tenant-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
      - name: Install dependencies
        run: node scripts/ci/npm-ci-with-retry.mjs
      - name: Install Playwright browser for runtime contracts
        run: ./node_modules/.bin/playwright install chromium
      - name: Validate tenant isolation
        run: npm run validate:tenant
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run -s typecheck
      - name: Run tests
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm test
