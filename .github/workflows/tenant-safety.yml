name: tenant-safety

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/server/**'
      - 'src/lib/auth*'
      - 'src/lib/runtimeConfig*'
      - 'scripts/ci/**'
      - '.github/workflows/**'
      - 'netlify.toml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/server/**'
      - 'src/lib/auth*'
      - 'src/lib/runtimeConfig*'
      - 'scripts/ci/**'
      - '.github/workflows/**'
      - 'netlify.toml'

jobs:
  tenant-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Validate tenant isolation
        run: npm run validate:tenant
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run -s typecheck
      - name: Run tests
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm test
